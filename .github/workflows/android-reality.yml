name: Android Reality Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/android-reality.yml'
      - 'product/e2e/android/**'
      - 'product/e2e/support/**'
      - 'product/scripts/experience/android-reality-*'
      - 'product/package.json'
      - 'product/package-lock.json'
      - 'product/src/**'

permissions:
  contents: read
  statuses: write

concurrency:
  group: docente-os-governed-mfa-e2e
  queue: max

env:
  E2E_EMAIL: ${{ secrets.DOCENTE_OS_MFA_E2E_EMAIL }}
  E2E_PASSWORD: ${{ secrets.DOCENTE_OS_MFA_E2E_PASSWORD }}
  E2E_TOTP_SECRET: ${{ secrets.DOCENTE_OS_MFA_E2E_TOTP_SECRET }}
  EXPERIENCE_TARGET: android
  NEXT_PUBLIC_SUPABASE_URL: https://gnshgapmwyjamhmlikeg.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_4Hqwe3dIqEWGrqSZmmQB8w_TgsfKc7L
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000

jobs:
  android-reality:
    name: android-reality-phase1
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout exact tested candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install product dependencies
        working-directory: product
        run: npm install --no-audit --no-fund

      - name: Install Playwright runner without changing the lockfile
        working-directory: product
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Run Android Reality contract tests
        shell: bash
        run: |
          node --test product/e2e/android/android-geometry.test.mjs product/scripts/experience/android-reality-report.test.mjs
          cd product
          npx tsx --test src/components/assistant/contextual-fab-protected-regions.test.ts

      - name: Build exact local product
        working-directory: product
        run: npm run build

      - name: Start exact local product
        working-directory: product
        shell: bash
        run: |
          npm start > /tmp/docente-os-android-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:3000/login >/dev/null; then
              echo 'Local DOCENTE OS runtime is ready.'
              exit 0
            fi
            sleep 2
          done
          cat /tmp/docente-os-android-server.log >&2 || true
          exit 1

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android Reality AR-01
        id: android
        continue-on-error: true
        env:
          EXPECTED_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: cd product && node e2e/android/run-android-reality.mjs

      - name: Publish Android Reality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reality-${{ github.run_id }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            product/test-results/android-reality/
            /tmp/docente-os-android-server.log

      - name: Publish exact-SHA Android Reality status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const sha = context.eventName === 'pull_request'
              ? context.payload.pull_request.head.sha
              : context.sha
            let receipt = null
            try {
              receipt = JSON.parse(fs.readFileSync('product/test-results/android-reality/receipt/android-reality.json', 'utf8'))
            } catch {}
            const outcome = receipt?.outcome ?? 'INFRA_BLOCKED'
            const state = outcome === 'FAIL_PRODUCT' ? 'failure'
              : outcome === 'INFRA_BLOCKED' ? 'error'
              : 'pending'
            const description = outcome === 'FAIL_PRODUCT'
              ? 'AR-01 ha rilevato un difetto prodotto; AR-02 non ancora eseguito'
              : outcome === 'INFRA_BLOCKED'
                ? 'Android Reality bloccato da infrastruttura o target integrity'
                : 'AR-01 superato; AR-02 ancora pendente'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state,
              context: 'hva/android-reality',
              description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })

      - name: Enforce Android Reality AR-01 outcome
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const path = 'product/test-results/android-reality/receipt/android-reality.json'
          if (!fs.existsSync(path)) process.exit(2)
          const receipt = JSON.parse(fs.readFileSync(path, 'utf8'))
          if (receipt.outcome === 'FAIL_PRODUCT') process.exit(1)
          if (receipt.outcome === 'INFRA_BLOCKED') process.exit(2)
          NODE
