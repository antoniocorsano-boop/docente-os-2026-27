name: Android Reality Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/android-reality.yml'
      - 'product/e2e/android/**'
      - 'product/scripts/experience/android-reality-*'
      - 'product/package.json'
      - 'product/package-lock.json'
      - 'product/src/**'

permissions:
  contents: read
  statuses: write

env:
  NEXT_PUBLIC_SUPABASE_URL: https://gnshgapmwyjamhmlikeg.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_4Hqwe3dIqEWGrqSZmmQB8w_TgsfKc7L
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000

jobs:
  infrastructure-feasibility:
    name: android-infrastructure-feasibility
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact tested candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install product dependencies
        working-directory: product
        run: npm install --no-audit --no-fund

      - name: Install Playwright runner without changing the lockfile
        working-directory: product
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Run Android Reality contract tests
        shell: bash
        run: |
          node --test product/e2e/android/android-geometry.test.mjs product/scripts/experience/android-reality-report.test.mjs
          cd product
          npx tsx --test src/components/assistant/contextual-fab-protected-regions.test.ts

      - name: Build exact local product
        working-directory: product
        run: npm run build

      - name: Start exact local product
        working-directory: product
        shell: bash
        run: |
          npm start > /tmp/docente-os-android-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:3000/login >/dev/null; then
              echo 'Local DOCENTE OS runtime is ready.'
              exit 0
            fi
            sleep 2
          done
          cat /tmp/docente-os-android-server.log >&2 || true
          exit 1

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prove Android emulator, ADB and Chrome reachability
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: cd product && node e2e/android/android-smoke.mjs

      - name: Publish Android infrastructure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reality-infrastructure-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            product/test-results/android-reality/
            /tmp/docente-os-android-server.log

      - name: Summarize infrastructure result
        if: always()
        shell: bash
        run: |
          if [ -f product/test-results/android-reality/infrastructure.json ]; then
            cat product/test-results/android-reality/infrastructure.json
          else
            echo '{"infrastructure":"INFRA_BLOCKED","error":"receipt missing"}'
          fi

      - name: Publish exact-SHA Android Reality status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.eventName === 'pull_request'
              ? context.payload.pull_request.head.sha
              : context.sha
            const infrastructurePassed = '${{ job.status }}' === 'success'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: infrastructurePassed ? 'pending' : 'error',
              context: 'hva/android-reality',
              description: infrastructurePassed
                ? 'Infrastructure proven; AR-01/AR-02 product journeys pending'
                : 'Android Reality infrastructure or contract blocked',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
