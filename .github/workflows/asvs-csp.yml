name: ASVS V3.4.3 CSP

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/asvs-csp.yml'
      - 'product/package.json'
      - 'product/proxy.ts'
      - 'product/playwright.security.config.mjs'
      - 'product/e2e/security/**'
      - 'product/src/core/security/**'
      - 'product/src/lib/supabase/proxy.ts'

permissions:
  contents: read

concurrency:
  group: asvs-csp-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  E2E_BASE_URL: http://127.0.0.1:3000
  NEXT_PUBLIC_SUPABASE_URL: https://gnshgapmwyjamhmlikeg.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_4Hqwe3dIqEWGrqSZmmQB8w_TgsfKc7L
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000

jobs:
  csp-assurance:
    name: asvs-v3-4-3-csp
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout exact tested head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install locked dependencies
        working-directory: product
        run: npm ci --no-audit --no-fund

      - name: Validate CSP contract
        working-directory: product
        run: npx tsx --test src/core/security/content-security-policy.test.ts

      - name: Install Playwright runner without changing the lockfile
        working-directory: product
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Build tested application
        working-directory: product
        run: npm run build

      - name: Start tested application
        working-directory: product
        shell: bash
        run: |
          npm start > /tmp/docente-os-csp-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 "$E2E_BASE_URL/login" >/dev/null; then
              echo 'Local DOCENTE OS runtime is ready.'
              exit 0
            fi
            sleep 2
          done
          cat /tmp/docente-os-csp-server.log >&2 || true
          exit 1

      - name: Install Chromium
        working-directory: product
        run: npx playwright install --with-deps chromium

      - name: Verify CSP in browser
        working-directory: product
        run: npx playwright test --config=playwright.security.config.mjs

      - name: Publish CSP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asvs-csp-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            product/test-results/security/
            /tmp/docente-os-csp-server.log
