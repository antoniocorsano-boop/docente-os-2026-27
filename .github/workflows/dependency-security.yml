name: Dependency Security Gate

on:
  push:
    branches:
      - hardening/dependency-lock-and-audit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate deterministic lockfile if missing
        working-directory: product
        run: npm install --package-lock-only --ignore-scripts --no-fund
      - name: Audit dependency graph
        working-directory: product
        run: npm audit --audit-level=high
      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- product/package-lock.json && git ls-files --error-unmatch product/package-lock.json >/dev/null 2>&1; then
            echo 'Lockfile already committed and unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add product/package-lock.json
          git commit -m 'Hardening: versiona dependency lockfile'
          git push origin HEAD:${GITHUB_REF_NAME}
