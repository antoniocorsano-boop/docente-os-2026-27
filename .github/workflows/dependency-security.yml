name: Dependency Security Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
    paths:
      - 'product/package.json'
      - 'product/package-lock.json'
      - '.github/scripts/dependency-security.mjs'
      - '.github/workflows/dependency-security.yml'
  push:
    branches:
      - develop
    paths:
      - 'product/package.json'
      - 'product/package-lock.json'
      - '.github/scripts/dependency-security.mjs'
      - '.github/workflows/dependency-security.yml'

permissions:
  contents: write
  statuses: write

jobs:
  dependency-security:
    name: dependency-security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: product
    steps:
      - name: Publish pending status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'ops-security/dependencies',
              description: 'Audit dipendenze runtime e sviluppo in esecuzione',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })

      - uses: actions/checkout@v6
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Record repository lockfile state
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            echo 'LOCKFILE_PRESENT_BEFORE=true' >> "$GITHUB_ENV"
          else
            echo 'LOCKFILE_PRESENT_BEFORE=false' >> "$GITHUB_ENV"
          fi

      - name: Resolve repository dependency graph
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm install --ignore-scripts --no-audit --no-fund
          fi

      - name: Capture full repository audit
        shell: bash
        run: npm audit --json > dependency-audit-full.json || true

      - name: Capture production-only audit
        shell: bash
        run: npm audit --omit=dev --json > dependency-audit-prod.json || true

      - name: Capture temporary E2E tooling audit separately
        shell: bash
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0
          npm audit --json > dependency-audit-playwright.json || true

      - name: Classify dependency findings
        run: node ../.github/scripts/dependency-security.mjs dependency-audit-full.json dependency-audit-prod.json dependency-audit-playwright.json | tee dependency-security-receipt.json

      - name: Bootstrap the audited lockfile on this repository PR
        if: github.event_name == 'pull_request' && env.LOCKFILE_PRESENT_BEFORE == 'false' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add product/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'P4: congela il grafo dipendenze auditato'
          git push origin "HEAD:${HEAD_REF}"

      - name: Publish dependency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            product/dependency-audit-full.json
            product/dependency-audit-prod.json
            product/dependency-audit-playwright.json
            product/dependency-security-receipt.json
            product/package-lock.json

      - name: Publish final status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const ok = process.env.JOB_STATUS === 'success'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'ops-security/dependencies',
              description: ok ? 'Nessun high/critical nel grafo prodotto/repository' : 'Dependency security gate non superato',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
