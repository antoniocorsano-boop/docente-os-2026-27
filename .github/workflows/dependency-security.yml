name: Dependency Security Gate

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: ["main", "develop"]
    paths:
      - "product/package.json"
      - "product/package-lock.json"
      - ".github/workflows/dependency-security.yml"
  pull_request:
    branches: ["develop"]
    paths:
      - "product/package.json"
      - "product/package-lock.json"
      - ".github/workflows/dependency-security.yml"

permissions:
  contents: read
  statuses: write

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: product
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit high and critical vulnerabilities
        id: audit
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json > ../dependency-audit.json
          status=$?
          set -e
          cat ../dependency-audit.json
          exit "$status"
      - name: Publish audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ github.run_id }}
          path: dependency-audit.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish dependency status
        if: always() && github.event_name != 'schedule'
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const ok = process.env.JOB_STATUS === 'success'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'dependency-security/npm',
              description: ok ? 'Dependency graph senza vulnerabilità high/critical' : 'Vulnerabilità high/critical o audit non riuscito',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
