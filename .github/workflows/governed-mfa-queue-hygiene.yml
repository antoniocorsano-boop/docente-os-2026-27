name: Governed MFA Queue Hygiene

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  cancel-obsolete-governed-runs:
    name: cancel-obsolete-governed-runs
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel obsolete governed MFA runs
        uses: actions/github-script@v7
        with:
          script: |
            const governedPaths = new Set([
              '.github/workflows/experience-acceptance.yml',
              '.github/workflows/x4-planner-e2e.yml',
              '.github/workflows/wcag22-aa-assurance.yml',
              '.github/workflows/k1-knowledge-e2e.yml',
              '.github/workflows/p6-performance.yml',
            ])
            const runtimePaths = new Set([
              '.github/workflows/experience-acceptance.yml',
              '.github/workflows/x4-planner-e2e.yml',
              '.github/workflows/k1-knowledge-e2e.yml',
              '.github/workflows/p6-performance.yml',
            ])
            const activeStatuses = ['queued', 'pending', 'in_progress', 'waiting', 'requested']

            const openPulls = await github.paginate(
              github.rest.pulls.list,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100,
              },
            )

            const currentOpenHeads = new Set(
              openPulls
                .filter((pr) => pr.head.repo?.full_name === context.payload.repository.full_name)
                .map((pr) => `${pr.head.ref}@${pr.head.sha}`),
            )

            const activePullRunsById = new Map()
            for (const status of activeStatuses) {
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  event: 'pull_request',
                  status,
                  per_page: 100,
                },
              )
              for (const run of runs) {
                if (governedPaths.has(run.path)) activePullRunsById.set(run.id, run)
              }
            }

            const activePullRuns = [...activePullRunsById.values()]
            const obsoletePullRuns = activePullRuns.filter((run) =>
              !currentOpenHeads.has(`${run.head_branch}@${run.head_sha}`),
            )
            const preservedPullRuns = activePullRuns.length - obsoletePullRuns.length

            const develop = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'develop',
            })
            const currentDevelopSha = develop.data.commit.sha

            const activePushRunsById = new Map()
            for (const status of activeStatuses) {
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  event: 'push',
                  branch: 'develop',
                  status,
                  per_page: 100,
                },
              )
              for (const run of runs) {
                if (runtimePaths.has(run.path) && run.head_branch === 'develop') {
                  activePushRunsById.set(run.id, run)
                }
              }
            }

            const activePushRuns = [...activePushRunsById.values()]
            const obsoleteRuntimeRuns = []
            let preservedRuntimeRuns = 0
            let unclassifiedRuntimeRuns = 0

            for (const run of activePushRuns) {
              if (run.head_sha === currentDevelopSha) {
                preservedRuntimeRuns += 1
                continue
              }

              try {
                const comparison = await github.rest.repos.compareCommitsWithBasehead({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  basehead: `${run.head_sha}...${currentDevelopSha}`,
                  per_page: 100,
                })
                const files = comparison.data.files ?? []
                const productChanged = files.some((file) => file.filename.startsWith('product/'))

                if (productChanged) {
                  obsoleteRuntimeRuns.push(run)
                  core.info(
                    `Stale governed runtime classified obsolete: ${run.name} #${run.run_number} ` +
                    `(${run.id}) ${run.head_sha} -> ${currentDevelopSha}; product changes detected.`,
                  )
                } else {
                  preservedRuntimeRuns += 1
                  core.info(
                    `Governed runtime preserved as potentially product-equivalent: ${run.name} ` +
                    `#${run.run_number} (${run.id}) ${run.head_sha} -> ${currentDevelopSha}.`,
                  )
                }
              } catch (error) {
                unclassifiedRuntimeRuns += 1
                core.warning(
                  `Could not classify governed runtime ${run.name} #${run.run_number} (${run.id}) ` +
                  `${run.head_sha}; preserving it. ${error.message ?? error}`,
                )
              }
            }

            core.info(`Open PR heads preserved: ${currentOpenHeads.size}.`)
            core.info(`Active governed PR runs inspected: ${activePullRuns.length}.`)
            core.info(`Current-head governed PR runs preserved: ${preservedPullRuns}.`)
            core.info(`Obsolete governed PR runs selected: ${obsoletePullRuns.length}.`)
            core.info(`Current develop SHA: ${currentDevelopSha}.`)
            core.info(`Active governed develop push runs inspected: ${activePushRuns.length}.`)
            core.info(`Governed runtime runs preserved: ${preservedRuntimeRuns}.`)
            core.info(`Governed runtime runs unclassified/preserved: ${unclassifiedRuntimeRuns}.`)
            core.info(`Obsolete governed runtime runs selected: ${obsoleteRuntimeRuns.length}.`)

            async function cancelRuns(runs, kind) {
              let cancelled = 0
              let raced = 0
              for (const run of runs.sort((a, b) => a.id - b.id)) {
                try {
                  await github.rest.actions.cancelWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id,
                  })
                  cancelled += 1
                  core.info(
                    `Cancellation requested for ${kind}: ${run.name} #${run.run_number} (${run.id}) ` +
                    `${run.head_branch}@${run.head_sha}.`,
                  )
                } catch (error) {
                  if ([409, 422].includes(error.status)) {
                    raced += 1
                    core.info(`Run ${run.id} is no longer cancellable; continuing.`)
                    continue
                  }
                  throw error
                }
              }
              return { cancelled, raced }
            }

            const prReceipt = await cancelRuns(obsoletePullRuns, 'obsolete-pr')
            const runtimeReceipt = await cancelRuns(obsoleteRuntimeRuns, 'obsolete-runtime')

            core.info(
              `Queue hygiene receipt: pr_cancelled=${prReceipt.cancelled}, pr_raced=${prReceipt.raced}, ` +
              `pr_preserved=${preservedPullRuns}, runtime_cancelled=${runtimeReceipt.cancelled}, ` +
              `runtime_raced=${runtimeReceipt.raced}, runtime_preserved=${preservedRuntimeRuns}, ` +
              `runtime_unclassified=${unclassifiedRuntimeRuns}.`,
            )
