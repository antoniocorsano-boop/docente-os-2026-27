name: Governed MFA Queue Hygiene

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  actions: write
  contents: read

jobs:
  cancel-obsolete-governed-runs:
    name: cancel-obsolete-governed-runs
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel obsolete governed MFA runs for this branch
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref
            const currentSha = context.payload.pull_request.head.sha
            const governedPaths = new Set([
              '.github/workflows/experience-acceptance.yml',
              '.github/workflows/x4-planner-e2e.yml',
              '.github/workflows/wcag22-aa-assurance.yml',
              '.github/workflows/k1-knowledge-e2e.yml',
              '.github/workflows/p6-performance.yml',
            ])

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch,
                per_page: 100,
              },
            )

            const obsolete = runs.filter((run) =>
              governedPaths.has(run.path) &&
              run.head_branch === branch &&
              run.head_sha !== currentSha &&
              ['queued', 'pending', 'in_progress', 'waiting'].includes(run.status)
            )

            core.info(`Current PR head: ${currentSha}`)
            core.info(`Found ${obsolete.length} obsolete governed MFA run(s) on ${branch}.`)

            let cancelled = 0
            for (const run of obsolete) {
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                })
                cancelled += 1
                core.info(`Cancellation requested for ${run.name} #${run.run_number} (${run.id}) @ ${run.head_sha}.`)
              } catch (error) {
                if ([409, 422].includes(error.status)) {
                  core.info(`Run ${run.id} is no longer cancellable; continuing.`)
                  continue
                }
                throw error
              }
            }

            core.info(`Cancellation requested for ${cancelled} obsolete governed MFA run(s).`)
