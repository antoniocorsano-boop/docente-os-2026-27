name: Governed MFA Queue Hygiene

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  cancel-obsolete-governed-runs:
    name: cancel-obsolete-governed-runs
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel obsolete governed MFA pull-request runs
        uses: actions/github-script@v7
        with:
          script: |
            const governedPaths = new Set([
              '.github/workflows/experience-acceptance.yml',
              '.github/workflows/x4-planner-e2e.yml',
              '.github/workflows/wcag22-aa-assurance.yml',
              '.github/workflows/k1-knowledge-e2e.yml',
              '.github/workflows/p6-performance.yml',
            ])
            const activeStatuses = ['queued', 'pending', 'in_progress', 'waiting', 'requested']

            const openPulls = await github.paginate(
              github.rest.pulls.list,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100,
              },
            )

            const currentOpenHeads = new Set(
              openPulls
                .filter((pr) => pr.head.repo?.full_name === context.payload.repository.full_name)
                .map((pr) => `${pr.head.ref}@${pr.head.sha}`),
            )

            const activeRunsById = new Map()
            for (const status of activeStatuses) {
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  event: 'pull_request',
                  status,
                  per_page: 100,
                },
              )
              for (const run of runs) {
                if (governedPaths.has(run.path)) activeRunsById.set(run.id, run)
              }
            }

            const activeRuns = [...activeRunsById.values()]
            const obsolete = activeRuns.filter((run) =>
              !currentOpenHeads.has(`${run.head_branch}@${run.head_sha}`),
            )
            const preserved = activeRuns.length - obsolete.length

            core.info(`Open PR heads preserved: ${currentOpenHeads.size}.`)
            core.info(`Active governed PR runs inspected: ${activeRuns.length}.`)
            core.info(`Current-head governed runs preserved: ${preserved}.`)
            core.info(`Obsolete governed runs selected for cancellation: ${obsolete.length}.`)

            let cancelled = 0
            let raced = 0
            for (const run of obsolete.sort((a, b) => a.id - b.id)) {
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                })
                cancelled += 1
                core.info(
                  `Cancellation requested for ${run.name} #${run.run_number} (${run.id}) ` +
                  `${run.head_branch}@${run.head_sha}.`,
                )
              } catch (error) {
                if ([409, 422].includes(error.status)) {
                  raced += 1
                  core.info(`Run ${run.id} is no longer cancellable; continuing.`)
                  continue
                }
                throw error
              }
            }

            core.info(`Queue hygiene receipt: cancelled=${cancelled}, raced=${raced}, preserved=${preserved}.`)
