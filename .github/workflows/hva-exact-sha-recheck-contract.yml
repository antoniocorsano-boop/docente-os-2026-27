name: HVA Exact-SHA Recheck Contract

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/experience-acceptance.yml'
      - '.github/workflows/hva-exact-sha-recheck-contract.yml'
      - 'product/scripts/experience/hva-exact-sha-recheck-contract.test.mjs'

permissions:
  contents: read

concurrency:
  group: hva-exact-sha-recheck-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contract:
    name: exact-sha-recheck-contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify fail-closed application recheck contract
        run: node --test product/scripts/experience/hva-exact-sha-recheck-contract.test.mjs
