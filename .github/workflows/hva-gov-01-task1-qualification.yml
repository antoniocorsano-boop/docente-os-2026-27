name: HVA-GOV-01 Task 1 Qualification

on:
  push:
    branches: ["test/hva-gov-01-task1-green"]

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Certification script tests
        run: node --test .github/scripts/certification/*.test.mjs

      - name: Runtime release contract tests
        run: node --test .github/scripts/runtime-release-contract.test.mjs

      - name: Certification foundation files
        shell: bash
        run: |
          set -euo pipefail
          test -f ops/runtime-release-contract.json
          test -f product/supabase/migrations/0074_runtime_schema_contract.sql
          test -f product/supabase/tests/runtime-release-contract.sql
          test -f .github/workflows/browser-certification-orchestrator.yml

      - name: Browser certification foundation markers
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'browser-certification-preflight' .github/workflows/browser-certification-orchestrator.yml
          grep -Fq 'browser-certification-selected-gates' .github/workflows/browser-certification-orchestrator.yml
          grep -Fq "context: statusContext" .github/workflows/browser-certification-orchestrator.yml

      - name: Governed MFA concurrency contract
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r workflow; do
            grep -Fq 'group: docente-os-governed-mfa-e2e' "$workflow" || {
              echo "Workflow using governed MFA fixture is outside the canonical concurrency queue: $workflow" >&2
              exit 1
            }
          done < <(grep -l 'DOCENTE_OS_MFA_E2E_' .github/workflows/*.yml | sort)
          test "$(grep -Fc 'group: docente-os-governed-mfa-e2e' .github/workflows/x3-e2e.yml)" -eq 2

      - name: X3 certification topology markers
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'x3-application-acceptance:' .github/workflows/x3-e2e.yml
          grep -Fq 'x3-render-acceptance:' .github/workflows/x3-e2e.yml

      - name: Classifier authority markers
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'orchestrationAuthorized: true' .github/scripts/certification/classifier.mjs
          grep -Fq 'mergeAuthorized: false' .github/scripts/certification/classifier.mjs

      - name: HVA-GOV-01 canonical clock contract
        run: node --test product/e2e/support/hva-governed-baseline-contract.test.mjs

      - name: Existing HVA Today fixture tests
        run: node --test product/e2e/support/hva-today-fixture.test.mjs
