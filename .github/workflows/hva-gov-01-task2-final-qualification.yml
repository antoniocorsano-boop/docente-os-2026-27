name: HVA-GOV-01 Task 2 Final Qualification

on:
  push:
    branches: ["test/hva-gov-01-task2-final-qualification"]

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify product tree matches Task 2 candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "5fab2a5bbbe20489cdb0cc1aa06dd931d8da4179"
          git diff --exit-code 5fab2a5bbbe20489cdb0cc1aa06dd931d8da4179 HEAD -- product/

      - name: Run Task 2 focused and compatibility tests
        working-directory: product
        run: node --test e2e/support/hva-governed-baseline-contract.test.mjs e2e/support/hva-today-fixture.test.mjs
