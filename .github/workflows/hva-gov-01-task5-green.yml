name: HVA-GOV-01 Task 5 GREEN

on:
  push:
    branches: ["test/hva-gov-01-task5-green"]

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prove product tree matches Task 5 candidate
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code d77762401d65b3bfd3d3e8dccf6cd29f7378e4b1 HEAD -- product/

      - name: Run Task 5 Today read-only contract
        working-directory: product
        run: node --test e2e/support/hva-today-fixture.test.mjs
