name: HVA-GOV-01 Task 6 FINAL2

on:
  push:
    branches:
      - test/hva-gov-01-task6-final2

permissions:
  contents: read

jobs:
  final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove candidate tree is unchanged except final qualification workflow
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only 2cccb710ba53006020aa73d4aa0e29de184f691a HEAD)"
          test "$changed" = ".github/workflows/hva-gov-01-task6-final2.yml"
      - name: Run target-aware scope contract
        run: node --test .github/scripts/certification/hva-receipt-scope.test.mjs
      - name: Run governed baseline receipt contract
        working-directory: product
        run: node --test scripts/experience/hva-baseline-integrity.test.mjs
