name: HVA-GOV-01 Task 6 GREEN

on:
  push:
    branches:
      - test/hva-gov-01-task6-green

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove candidate tree is unchanged except qualification workflow
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only ddac3dfd1e35648abcdb067a9393373305270ada HEAD)"
          test "$changed" = ".github/workflows/hva-gov-01-task6-green.yml"
      - name: Run target-aware scope contract
        run: node --test .github/scripts/certification/hva-receipt-scope.test.mjs
      - name: Run governed baseline receipt contract
        working-directory: product
        run: node --test scripts/experience/hva-baseline-integrity.test.mjs
