name: HVA-GOV-01 Task 6 ORDER GREEN

on:
  push:
    branches:
      - test/hva-gov-01-task6-order-green

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove candidate tree unchanged except qualification workflow
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only 5dbb29a6be6526b5383d4eb57eacff38c91e0106 HEAD)"
          test "$changed" = ".github/workflows/hva-gov-01-task6-order-green.yml"
      - name: Run target-aware scope contract
        run: node --test .github/scripts/certification/hva-receipt-scope.test.mjs
      - name: Run governed baseline receipt contract
        working-directory: product
        run: node --test scripts/experience/hva-baseline-integrity.test.mjs
