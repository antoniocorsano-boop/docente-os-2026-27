name: HVA-GOV-01 Task 6 ORDER RED

on:
  push:
    branches:
      - test/hva-gov-01-task6-order-red

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove RED product delta is test-only
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only 2cccb710ba53006020aa73d4aa0e29de184f691a HEAD | grep -v '^.github/workflows/hva-gov-01-task6-order-red.yml$')"
          test "$changed" = ".github/scripts/certification/hva-receipt-scope.test.mjs"
      - name: Run ordering regression contract
        run: node --test .github/scripts/certification/hva-receipt-scope.test.mjs
