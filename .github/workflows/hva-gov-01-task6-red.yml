name: HVA-GOV-01 Task 6 RED

on:
  push:
    branches: ["test/hva-gov-01-task6-red"]

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prove Task 6 RED changes only tests
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only d77762401d65b3bfd3d3e8dccf6cd29f7378e4b1 HEAD \
            | grep -v '^.github/workflows/hva-gov-01-task6-red.yml$' \
            | sort > /tmp/actual
          printf '%s\n' \
            '.github/scripts/certification/hva-receipt-scope.test.mjs' \
            'product/scripts/experience/hva-baseline-integrity.test.mjs' \
            | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual

      - name: Run target-aware scope RED
        run: node --test .github/scripts/certification/hva-receipt-scope.test.mjs

      - name: Run baseline receipt RED
        if: always()
        working-directory: product
        run: node --test scripts/experience/hva-baseline-integrity.test.mjs
