name: HVA-GOV-01 Task 6 reorder

on:
  push:
    branches:
      - feat/hva-gov-01-task6-target-aware-receipts

permissions:
  contents: write

jobs:
  reorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/hva-gov-01-task6-target-aware-receipts
          fetch-depth: 2
      - name: Reorder preflight
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/experience-acceptance.yml')
          s = p.read_text()
          block = """      - name: Verify governed baseline preflight
        if: steps.credentials.outputs.ready == 'true'
        working-directory: product
        run: node scripts/experience/hva-baseline-integrity.mjs preflight

"""
          if s.count(block) != 1:
              raise SystemExit(f'expected one preflight block, found {s.count(block)}')
          s = s.replace(block, '', 1)
          marker = """      - name: Build tested application
"""
          if marker not in s:
              raise SystemExit('build marker not found')
          s = s.replace(marker, block + marker, 1)
          p.write_text(s)
          PY
      - name: Verify order
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('.github/workflows/experience-acceptance.yml').read_text().split('\n  runtime-acceptance:', 1)[0]
          assert s.index('Install Playwright runner without changing the lockfile') < s.index('hva-baseline-integrity.mjs preflight') < s.index('Build tested application')
          PY
      - name: Commit reorder
        run: |
          git config user.name 'Antonio Corsano'
          git config user.email 'antonio.corsano@gmail.com'
          git add .github/workflows/experience-acceptance.yml
          git commit -m 'ci(hva): run baseline preflight after Playwright install'
          git push origin HEAD:feat/hva-gov-01-task6-target-aware-receipts
