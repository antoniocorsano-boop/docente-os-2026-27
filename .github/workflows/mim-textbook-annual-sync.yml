name: MIM Textbook Annual Sync

on:
  workflow_dispatch:
    inputs:
      academic_year_code:
        description: Codice anno scolastico MIM da sincronizzare
        required: true
        default: '202627'

permissions:
  contents: read
  id-token: write

concurrency:
  group: mim-textbook-annual-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'antoniocorsano-boop/docente-os-2026-27'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: product/package-lock.json

      - name: Validate annual request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          requested_year='${{ inputs.academic_year_code }}'
          if [[ ! "$requested_year" =~ ^20[0-9]{4}$ ]]; then
            echo "::error::Invalid MIM academic year code"
            exit 1
          fi
          if [[ "$requested_year" != "202627" ]]; then
            echo "::error::This synchronizer revision is certified only for MIM snapshot 202627. Update and certify the source contract before another annual run."
            exit 1
          fi
          echo "academic_year_code=$requested_year" >> "$GITHUB_OUTPUT"

      - name: Install synchronizer dependencies
        working-directory: product
        run: npm ci --no-audit --no-fund

      - name: Request short-lived GitHub OIDC credential
        shell: bash
        run: |
          set -euo pipefail
          audience='docente-os-mim-textbook-annual-sync'
          encoded_audience="$(node -e "process.stdout.write(encodeURIComponent(process.argv[1]))" "$audience")"
          oidc_response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}")"
          oidc_token="$(node -e "const p=JSON.parse(process.argv[1]); if (!p.value) process.exit(2); process.stdout.write(p.value)" "$oidc_response")"
          echo "::add-mask::$oidc_token"
          echo "MIM_SYNC_TOKEN=$oidc_token" >> "$GITHUB_ENV"

      - name: Synchronize annual MIM textbook snapshot
        working-directory: product
        env:
          MIM_SYNC_EDGE_URL: https://gnshgapmwyjamhmlikeg.supabase.co/functions/v1/mim-textbook-sync
        shell: bash
        run: |
          set -euo pipefail
          npm run sync:mim-textbooks | tee ../mim-textbook-sync-receipt.txt

      - name: Publish sync receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mim-textbook-sync-${{ steps.request.outputs.academic_year_code }}-${{ github.run_id }}
          path: mim-textbook-sync-receipt.txt
          retention-days: 90
          if-no-files-found: error
