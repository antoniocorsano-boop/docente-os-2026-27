name: Openship Docker Compose deployment smoke

on:
  push:
    branches:
      - test/openship-smoke-20260823
    paths-ignore:
      - .openship-smoke-result.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: product
        name: Run canonical Docente OS gates
        continue-on-error: true
        working-directory: product
        run: |
          npm install
          npm test
          npm run typecheck
          npm run lint
          npm run build

      - id: setup
        name: Provision Openship with Docker Compose
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker compose version
          npm install --global openship
          openship --version | tee /tmp/openship-version.txt

          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          printf '%s' "$password" > /tmp/openship-admin-password
          chmod 600 /tmp/openship-admin-password
          export OPENSHIP_ADMIN_PASSWORD="$password"
          export HOST_DOMAIN=localhost

          openship up \
            --compose \
            --no-host-control \
            --edge cancel \
            --non-interactive \
            --admin-name "Docente OS Smoke" \
            --admin-email "openship-smoke@example.com" \
            --domain-kind none \
            > /tmp/openship-provision.log 2>&1

          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error http://127.0.0.1:4000/api/health > /tmp/openship-health.json; then
              cat /tmp/openship-health.json
              docker ps --format '{{.Names}} {{.Status}} {{.Ports}}' > /tmp/docker-ps.txt
              cat /tmp/docker-ps.txt
              exit 0
            fi
            sleep 2
          done
          cat /tmp/openship-provision.log
          docker ps -a
          exit 1

      - id: auth
        name: Authenticate and configure CLI
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          password="$(cat /tmp/openship-admin-password)"
          login_body="$(jq -nc --arg email 'openship-smoke@example.com' --arg password "$password" '{email:$email,password:$password}')"
          login_status="$(curl --silent --show-error \
            --output /tmp/openship-login.json \
            --write-out '%{http_code}' \
            --cookie-jar /tmp/openship-cookies.txt \
            --request POST http://127.0.0.1:4000/api/auth/sign-in/email \
            --header 'Content-Type: application/json' \
            --header 'Origin: http://localhost:3001' \
            --data "$login_body")"
          echo "$login_status" > /tmp/openship-login-status.txt
          test "$login_status" -ge 200 -a "$login_status" -lt 300

          token_status="$(curl --silent --show-error \
            --output /tmp/openship-token-response.json \
            --write-out '%{http_code}' \
            --cookie /tmp/openship-cookies.txt \
            --request POST http://127.0.0.1:4000/api/tokens \
            --header 'Content-Type: application/json' \
            --header 'Origin: http://localhost:3001' \
            --data '{"name":"docente-os-compose-smoke","fullAccess":true,"expiresInDays":1}')"
          echo "$token_status" > /tmp/openship-token-status.txt
          test "$token_status" -ge 200 -a "$token_status" -lt 300

          token="$(jq -r '.data.token // empty' /tmp/openship-token-response.json)"
          test -n "$token"
          echo "::add-mask::$token"
          printf '%s' "$token" > /tmp/openship-token
          chmod 600 /tmp/openship-token
          openship login \
            --token "$token" \
            --api-url http://127.0.0.1:4000 \
            --dashboard-url http://127.0.0.1:3001 \
            --context docente-os-smoke \
            > /tmp/openship-cli-login.txt 2>&1
          openship context use docente-os-smoke

      - id: prepare
        name: Detect Docente OS stack
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat /tmp/openship-token)"
          echo "::add-mask::$token"
          status="$(curl --silent --show-error \
            --output /tmp/openship-prepare.json \
            --write-out '%{http_code}' \
            --request POST http://127.0.0.1:4000/api/deployments/prepare \
            --header "Authorization: Bearer $token" \
            --header 'Content-Type: application/json' \
            --data "{\"source\":\"local\",\"path\":\"${GITHUB_WORKSPACE}/product\"}")"
          echo "$status" > /tmp/openship-prepare-status.txt
          test "$status" -ge 200 -a "$status" -lt 300
          cat /tmp/openship-prepare.json

      - id: deploy
        name: Deploy Docente OS through Openship
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/docente-os-openship-smoke
          mkdir -p /tmp/docente-os-openship-smoke
          rsync -a \
            --exclude node_modules \
            --exclude .next \
            --exclude .git \
            product/ /tmp/docente-os-openship-smoke/
          cd /tmp/docente-os-openship-smoke
          openship deploy \
            --name docente-os-openship-smoke \
            --env preview \
            --watch \
            2>&1 | tee /tmp/openship-deploy.log

      - id: inspect
        name: Inspect project and runtime
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          openship --json project list > /tmp/openship-projects.json
          project_id="$(jq -r '[.. | objects | select((.name? // "") == "docente-os-openship-smoke") | .id?] | map(select(. != null)) | first // empty' /tmp/openship-projects.json)"
          if [ -z "$project_id" ]; then
            project_id="$(grep -Eo 'proj_[A-Za-z0-9_-]+' /tmp/openship-deploy.log | tail -n 1 || true)"
          fi
          printf '%s' "$project_id" > /tmp/openship-project-id.txt
          test -n "$project_id"
          openship --json project get "$project_id" > /tmp/openship-project.json
          openship project logs "$project_id" > /tmp/openship-runtime.log 2>&1 || true
          docker ps --format '{{.Names}} {{.Status}} {{.Ports}}' > /tmp/docker-ps-after.txt

          url='http://docente-os-openship-smoke.localhost'
          printf '%s' "$url" > /tmp/openship-runtime-url.txt
          status="$(curl --location --silent --show-error \
            --output /tmp/openship-runtime-body.html \
            --write-out '%{http_code}' \
            --max-time 20 "$url" || true)"
          printf '%s' "$status" > /tmp/openship-runtime-status.txt
          echo "runtime_url=$url status=$status" > /tmp/openship-runtime-probe.txt

      - name: Record result
        if: always()
        env:
          PRODUCT: ${{ steps.product.outcome }}
          SETUP: ${{ steps.setup.outcome }}
          AUTH: ${{ steps.auth.outcome }}
          PREPARE: ${{ steps.prepare.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          INSPECT: ${{ steps.inspect.outcome }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          def text(path, limit=22000):
              p = Path(path)
              if not p.exists(): return None
              return p.read_text(errors='replace').strip()[-limit:]

          def json_file(path):
              raw = text(path)
              if not raw: return None
              try: return json.loads(raw)
              except Exception: return raw

          result = {
              'test': 'openship-compose-deployment-smoke',
              'base_develop_sha': '4ba3831a8a0285792ae0a03890eea9c387d466ab',
              'tested_workflow_sha': os.environ.get('TESTED_SHA'),
              'product_gates': os.environ.get('PRODUCT'),
              'openship_version': text('/tmp/openship-version.txt'),
              'setup': os.environ.get('SETUP'),
              'health_payload': json_file('/tmp/openship-health.json'),
              'docker_before_deploy': text('/tmp/docker-ps.txt'),
              'auth': os.environ.get('AUTH'),
              'login_http_status': text('/tmp/openship-login-status.txt'),
              'pat_http_status': text('/tmp/openship-token-status.txt'),
              'prepare': os.environ.get('PREPARE'),
              'prepare_http_status': text('/tmp/openship-prepare-status.txt'),
              'prepare_payload': json_file('/tmp/openship-prepare.json'),
              'deployment': os.environ.get('DEPLOY'),
              'deployment_log_tail': text('/tmp/openship-deploy.log'),
              'inspect': os.environ.get('INSPECT'),
              'project_id': text('/tmp/openship-project-id.txt'),
              'project': json_file('/tmp/openship-project.json'),
              'runtime_url': text('/tmp/openship-runtime-url.txt'),
              'runtime_http_status': text('/tmp/openship-runtime-status.txt'),
              'runtime_probe_detail': text('/tmp/openship-runtime-probe.txt'),
              'runtime_log_tail': text('/tmp/openship-runtime.log'),
              'docker_after_deploy': text('/tmp/docker-ps-after.txt'),
              'provision_log_tail': text('/tmp/openship-provision.log'),
          }
          Path('.openship-smoke-result.json').write_text(json.dumps(result, indent=2, ensure_ascii=False) + '\n')
          PY
          cat .openship-smoke-result.json

      - name: Commit result on test branch only
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .openship-smoke-result.json
          git diff --cached --quiet && exit 0
          git commit -m "test: record Openship Compose result"
          git push origin HEAD:test/openship-smoke-20260823
