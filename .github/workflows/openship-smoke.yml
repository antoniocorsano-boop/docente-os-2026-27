name: Openship authenticated deployment smoke

on:
  push:
    branches:
      - test/openship-smoke-20260823
    paths-ignore:
      - .openship-smoke-result.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v6

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: product
        name: Run canonical Docente OS gates
        continue-on-error: true
        working-directory: product
        run: |
          npm install
          npm test
          npm run typecheck
          npm run lint
          npm run build

      - id: cli
        name: Install Openship CLI
        continue-on-error: true
        run: |
          npm install --global openship
          openship --version | tee /tmp/openship-version.txt
          openship login --help > /tmp/openship-login-help.txt
          openship deploy --help > /tmp/openship-deploy-help.txt

      - id: provision
        name: Provision ephemeral authenticated Openship instance
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          printf '%s' "$password" > /tmp/openship-admin-password
          chmod 600 /tmp/openship-admin-password
          export OPENSHIP_ADMIN_PASSWORD="$password"
          openship up \
            --bare \
            --non-interactive \
            --admin-name "Docente OS Smoke" \
            --admin-email "openship-smoke@example.com" \
            --domain-kind none \
            > /tmp/openship-provision.log 2>&1

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:4000/api/health > /tmp/openship-health.json; then
              cat /tmp/openship-health.json
              exit 0
            fi
            sleep 2
          done
          cat /tmp/openship-provision.log
          exit 1

      - id: session
        name: Sign in with ephemeral admin and mint a PAT
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          password="$(cat /tmp/openship-admin-password)"
          login_body="$(jq -nc --arg email 'openship-smoke@example.com' --arg password "$password" '{email:$email,password:$password}')"
          login_status="$(curl --silent --show-error \
            --output /tmp/openship-login.json \
            --write-out '%{http_code}' \
            --cookie-jar /tmp/openship-cookies.txt \
            --request POST http://127.0.0.1:4000/api/auth/sign-in/email \
            --header 'Content-Type: application/json' \
            --header 'Origin: http://localhost:3001' \
            --data "$login_body")"
          echo "$login_status" > /tmp/openship-login-status.txt
          test "$login_status" -ge 200 -a "$login_status" -lt 300

          token_status="$(curl --silent --show-error \
            --output /tmp/openship-token-response.json \
            --write-out '%{http_code}' \
            --cookie /tmp/openship-cookies.txt \
            --request POST http://127.0.0.1:4000/api/tokens \
            --header 'Content-Type: application/json' \
            --header 'Origin: http://localhost:3001' \
            --data '{"name":"docente-os-smoke","fullAccess":true,"expiresInDays":1}')"
          echo "$token_status" > /tmp/openship-token-status.txt
          test "$token_status" -ge 200 -a "$token_status" -lt 300

          token="$(jq -r '.data.token // empty' /tmp/openship-token-response.json)"
          test -n "$token"
          echo "::add-mask::$token"
          printf '%s' "$token" > /tmp/openship-token
          chmod 600 /tmp/openship-token

      - id: login
        name: Authenticate Openship CLI with ephemeral PAT
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat /tmp/openship-token)"
          echo "::add-mask::$token"
          openship login \
            --token "$token" \
            --api-url http://127.0.0.1:4000 \
            --dashboard-url http://127.0.0.1:3001 \
            --context docente-os-smoke \
            > /tmp/openship-cli-login.txt 2>&1
          openship context use docente-os-smoke
          openship --json context list > /tmp/openship-contexts.json

      - id: prepare
        name: Run authenticated Openship detection on Docente OS
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat /tmp/openship-token)"
          echo "::add-mask::$token"
          status="$(curl --silent --show-error \
            --output /tmp/openship-prepare.json \
            --write-out '%{http_code}' \
            --request POST http://127.0.0.1:4000/api/deployments/prepare \
            --header "Authorization: Bearer $token" \
            --header 'Content-Type: application/json' \
            --data "{\"source\":\"local\",\"path\":\"${GITHUB_WORKSPACE}/product\"}")"
          echo "$status" > /tmp/openship-prepare-status.txt
          test "$status" -ge 200 -a "$status" -lt 300
          cat /tmp/openship-prepare.json

      - id: deploy
        name: Deploy Docente OS through Openship folder pipeline
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/docente-os-openship-smoke
          mkdir -p /tmp/docente-os-openship-smoke
          rsync -a \
            --exclude node_modules \
            --exclude .next \
            --exclude .git \
            product/ /tmp/docente-os-openship-smoke/

          cd /tmp/docente-os-openship-smoke
          openship deploy \
            --name docente-os-openship-smoke \
            --env preview \
            --watch \
            2>&1 | tee /tmp/openship-deploy.log

      - id: inspect
        name: Inspect deployed project and runtime logs
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          openship --json project list > /tmp/openship-projects.json
          project_id="$(jq -r '[.. | objects | select((.name? // "") == "docente-os-openship-smoke") | .id?] | map(select(. != null)) | first // empty' /tmp/openship-projects.json)"
          if [ -z "$project_id" ]; then
            project_id="$(grep -Eo 'proj_[A-Za-z0-9_-]+' /tmp/openship-deploy.log | tail -n 1 || true)"
          fi
          printf '%s' "$project_id" > /tmp/openship-project-id.txt
          test -n "$project_id"
          openship --json project get "$project_id" > /tmp/openship-project.json
          openship project logs "$project_id" > /tmp/openship-runtime.log 2>&1 || true

      - id: runtime
        name: Probe any runtime URL reported by Openship
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re
          from pathlib import Path
          data = json.loads(Path('/tmp/openship-project.json').read_text())
          urls = []
          def walk(v):
              if isinstance(v, dict):
                  for x in v.values(): walk(x)
              elif isinstance(v, list):
                  for x in v: walk(x)
              elif isinstance(v, str):
                  urls.extend(re.findall(r'https?://[^\s"<>]+', v))
          walk(data)
          urls = [u.rstrip('.,;)') for u in urls if '127.0.0.1:4000' not in u and 'localhost:4000' not in u]
          Path('/tmp/openship-runtime-url.txt').write_text((urls[0] if urls else '') + '\n')
          PY
          url="$(cat /tmp/openship-runtime-url.txt)"
          if [ -z "$url" ]; then
            echo 'No runtime URL was exposed in project metadata.' > /tmp/openship-runtime-probe.txt
            exit 0
          fi
          status="$(curl --location --silent --show-error --output /tmp/openship-runtime-body.html --write-out '%{http_code}' --max-time 20 "$url" || true)"
          echo "$status" > /tmp/openship-runtime-status.txt
          echo "runtime_url=$url status=$status" > /tmp/openship-runtime-probe.txt
          test -n "$status"

      - name: Write machine-readable smoke result
        if: always()
        env:
          PRODUCT_OUTCOME: ${{ steps.product.outcome }}
          CLI_OUTCOME: ${{ steps.cli.outcome }}
          PROVISION_OUTCOME: ${{ steps.provision.outcome }}
          SESSION_OUTCOME: ${{ steps.session.outcome }}
          LOGIN_OUTCOME: ${{ steps.login.outcome }}
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          INSPECT_OUTCOME: ${{ steps.inspect.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          def text(path, limit=12000):
              p = Path(path)
              if not p.exists(): return None
              value = p.read_text(errors='replace').strip()
              return value[-limit:]

          def json_file(path):
              raw = text(path)
              if not raw: return None
              try: return json.loads(raw)
              except Exception: return raw

          result = {
              'test': 'openship-authenticated-deployment-smoke',
              'base_develop_sha': '4ba3831a8a0285792ae0a03890eea9c387d466ab',
              'tested_workflow_sha': os.environ.get('TESTED_SHA'),
              'product_gates': os.environ.get('PRODUCT_OUTCOME'),
              'openship_cli': os.environ.get('CLI_OUTCOME'),
              'openship_version': text('/tmp/openship-version.txt'),
              'provision': os.environ.get('PROVISION_OUTCOME'),
              'health_payload': json_file('/tmp/openship-health.json'),
              'session_auth': os.environ.get('SESSION_OUTCOME'),
              'login_http_status': text('/tmp/openship-login-status.txt'),
              'pat_http_status': text('/tmp/openship-token-status.txt'),
              'cli_login': os.environ.get('LOGIN_OUTCOME'),
              'prepare': os.environ.get('PREPARE_OUTCOME'),
              'prepare_http_status': text('/tmp/openship-prepare-status.txt'),
              'prepare_payload': json_file('/tmp/openship-prepare.json'),
              'deployment': os.environ.get('DEPLOY_OUTCOME'),
              'deployment_log_tail': text('/tmp/openship-deploy.log', 16000),
              'inspect': os.environ.get('INSPECT_OUTCOME'),
              'project_id': text('/tmp/openship-project-id.txt'),
              'project': json_file('/tmp/openship-project.json'),
              'runtime_probe': os.environ.get('RUNTIME_OUTCOME'),
              'runtime_url': text('/tmp/openship-runtime-url.txt'),
              'runtime_http_status': text('/tmp/openship-runtime-status.txt'),
              'runtime_probe_detail': text('/tmp/openship-runtime-probe.txt'),
              'runtime_log_tail': text('/tmp/openship-runtime.log', 12000),
              'provision_log_tail': text('/tmp/openship-provision.log', 12000),
          }
          Path('.openship-smoke-result.json').write_text(json.dumps(result, indent=2, ensure_ascii=False) + '\n')
          PY
          cat .openship-smoke-result.json

      - name: Commit smoke result to test branch only
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .openship-smoke-result.json
          git diff --cached --quiet && exit 0
          git commit -m "test: record authenticated Openship deployment result"
          git push origin HEAD:test/openship-smoke-20260823
