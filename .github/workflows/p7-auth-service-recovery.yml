name: P7 Supabase Auth Service Recovery

on:
  pull_request:
    branches: [develop]
    paths:
      - '.github/scripts/run-local-supabase-auth-recovery.mjs'
      - '.github/workflows/p7-auth-service-recovery.yml'
      - 'docs/product/P7_SUPABASE_AUTH_RECOVERY_RECEIPT.md'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  auth-service-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Initialize isolated local Supabase project
        run: |
          mkdir -p "$RUNNER_TEMP/docente-os-auth-recovery"
          cd "$RUNNER_TEMP/docente-os-auth-recovery"
          supabase init

      - name: Start local Supabase stack
        run: |
          cd "$RUNNER_TEMP/docente-os-auth-recovery"
          supabase start

      - name: Publish pending recovery status
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: 'pending',
              context: 'p7-recovery/supabase-auth-service',
              description: 'Supabase Auth recovery rehearsal in corso',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })

      - name: Run GoTrue password recovery rehearsal
        env:
          SUPABASE_REHEARSAL_DIR: ${{ runner.temp }}/docente-os-auth-recovery
        run: node .github/scripts/run-local-supabase-auth-recovery.mjs

      - name: Publish final recovery status
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const ok = process.env.JOB_STATUS === 'success'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: ok ? 'success' : 'failure',
              context: 'p7-recovery/supabase-auth-service',
              description: ok ? 'Supabase Auth recovery verificato' : 'Supabase Auth recovery non superato',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })

      - name: Stop isolated local Supabase stack
        if: always()
        run: |
          cd "$RUNNER_TEMP/docente-os-auth-recovery"
          supabase stop --no-backup || true
