name: P7 Database Real Readiness PostgreSQL 17

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/p7-db-real-readiness-pg17.sh'
      - '.github/workflows/p7-db-real-readiness-pg17.yml'
      - 'docs/product/P7_DB_REAL_BACKUP_READINESS.md'

permissions:
  contents: read

# Intentionally NO workflow_dispatch and NO R2/Supabase secret references.
# This workflow can only exercise disposable synthetic data on pull requests.
jobs:
  pg17-encrypted-stream-rehearsal:
    name: PostgreSQL 17 / synthetic encrypt / restore
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-only-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      P7_READINESS_SYNTHETIC_ONLY: 'yes'
      PGHOST: '127.0.0.1'
      PGPORT: '5432'
      PGUSER: 'postgres'
      PGPASSWORD: 'synthetic-only-password'
      PGDATABASE: 'postgres'
    steps:
      - uses: actions/checkout@v6
      - name: Install encryption utility
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
      - name: Validate fail-closed synthetic-only script syntax
        run: bash -n .github/scripts/p7-db-real-readiness-pg17.sh
      - name: Rehearse PostgreSQL 17 encrypted stream and independent local restore
        run: bash .github/scripts/p7-db-real-readiness-pg17.sh
