name: P7 DB Restore Rehearsal

on:
  pull_request:
    branches: [develop]
    paths:
      - 'product/supabase/migrations/**'
      - '.github/fixtures/local-supabase-compat.sql'
      - '.github/scripts/run-local-db-restore-rehearsal.sh'
      - '.github/workflows/p7-db-restore-rehearsal.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  restore-rehearsal:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v6

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Publish pending restore status
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: 'pending',
              context: 'p7-recovery/db-restore-rehearsal',
              description: 'Restore rehearsal DB isolato in esecuzione',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })

      - name: Run isolated DB backup and restore rehearsal
        run: bash .github/scripts/run-local-db-restore-rehearsal.sh

      - name: Publish final restore status
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const ok = process.env.JOB_STATUS === 'success'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: ok ? 'success' : 'failure',
              context: 'p7-recovery/db-restore-rehearsal',
              description: ok ? 'Restore rehearsal DB isolato verificato' : 'Restore rehearsal DB isolato non superato',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
