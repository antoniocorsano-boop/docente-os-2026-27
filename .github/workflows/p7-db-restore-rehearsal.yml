name: P7 DB Restore Rehearsal

on:
  workflow_call:
    inputs:
      tested_sha:
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  restore-rehearsal:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      TESTED_SHA: ${{ inputs.tested_sha || github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tested_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact tested head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Publish pending restore status
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_call'
        uses: actions/github-script@v7
        env:
          TESTED_SHA: ${{ inputs.tested_sha || github.event.pull_request.head.sha || github.sha }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.TESTED_SHA,
              state: 'pending',
              context: 'p7-recovery/db-restore-rehearsal',
              description: 'Restore rehearsal DB isolato in esecuzione',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })

      - name: Run isolated DB backup and restore rehearsal
        run: bash .github/scripts/run-local-db-restore-rehearsal.sh

      - name: Publish final restore status
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_call')
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          TESTED_SHA: ${{ inputs.tested_sha || github.event.pull_request.head.sha || github.sha }}
        with:
          script: |
            const ok = process.env.JOB_STATUS === 'success'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.TESTED_SHA,
              state: ok ? 'success' : 'failure',
              context: 'p7-recovery/db-restore-rehearsal',
              description: ok ? 'Restore rehearsal DB isolato verificato' : 'Restore rehearsal DB isolato non superato',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
