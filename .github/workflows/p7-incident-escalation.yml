name: P7 Incident Escalation Minimum

on:
  pull_request:
    branches: [develop]
    paths:
      - 'docs/product/P7_INCIDENT_ESCALATION_CONTRACT.md'
      - 'docs/product/P7_INCIDENT_ESCALATION_REHEARSAL_RECEIPT.md'
      - 'ops/incident-escalation-rehearsal-receipt.json'
      - '.github/ISSUE_TEMPLATE/incident-escalation.yml'
      - '.github/scripts/validate-incident-escalation.sh'
      - '.github/workflows/p7-incident-escalation.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  statuses: write

jobs:
  incident-escalation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Publish pending status
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: 'pending',
              context: 'p7-incident/escalation-contract',
              description: 'Validazione escalation owner-visible in corso',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
      - name: Validate minimum incident escalation contract
        run: bash .github/scripts/validate-incident-escalation.sh
      - name: Verify synthetic rehearsal issue and receipt
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const receipt = JSON.parse(fs.readFileSync('ops/incident-escalation-rehearsal-receipt.json', 'utf8'))
            const fail = (message) => { throw new Error(`Incident rehearsal invalid: ${message}`) }
            if (receipt.gate !== 'INCIDENT_ESCALATION_MINIMUM' || receipt.result !== 'PASS') fail('receipt must declare PASS')
            if (receipt.channel !== 'GITHUB_ISSUE') fail('canonical channel must be GitHub Issue')
            if (receipt.syntheticDataOnly !== true || receipt.realDataInvolved !== false) fail('rehearsal must be synthetic only')
            if (receipt.productionTouched !== false || receipt.betaTouched !== false) fail('runtime environments must not be touched')
            if (receipt.mutatingApplicationActionsPerformed !== false) fail('no application mutation is allowed')
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: receipt.issueNumber,
            })
            if (issue.pull_request) fail('receipt target must be an issue, not a PR')
            if (issue.state !== 'closed' || issue.state_reason !== 'completed') fail('rehearsal issue must be closed/completed')
            if (!issue.assignees.some((a) => a.login === receipt.ownerAssignee)) fail('owner assignee missing')
            const body = issue.body ?? ''
            for (const marker of ['PRODUCTION_INACTIVE', 'SEV-4', 'Real data involved', 'NO', 'Owner action required', 'productionTouched: false', 'betaTouched: false']) {
              if (!body.includes(marker)) fail(`issue body missing ${marker}`)
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: receipt.issueNumber,
              per_page: 100,
            })
            const receiptComment = comments.find((c) => (c.body ?? '').includes('Final incident receipt'))
            if (!receiptComment) fail('final incident receipt comment missing')
            for (const marker of ['finalStatus: RESOLVED', 'containmentVerified: true', 'followUpRequired: false', 'ownerVisibilityVerified: true']) {
              if (!(receiptComment.body ?? '').includes(marker)) fail(`final receipt missing ${marker}`)
            }
            console.log(`Incident escalation rehearsal PASS: issue #${receipt.issueNumber}, state=${issue.state}, assignee=${receipt.ownerAssignee}`)
      - name: Publish final status
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const ok = process.env.JOB_STATUS === 'success'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: ok ? 'success' : 'failure',
              context: 'p7-incident/escalation-contract',
              description: ok ? 'Escalation owner-visible e rehearsal validati' : 'Escalation owner-visible non valida',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
