name: P7 Incident Escalation Minimum

on:
  pull_request:
    branches: [develop]
    paths:
      - 'docs/product/P7_INCIDENT_ESCALATION_CONTRACT.md'
      - '.github/ISSUE_TEMPLATE/incident-escalation.yml'
      - '.github/scripts/validate-incident-escalation.sh'
      - '.github/workflows/p7-incident-escalation.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  incident-escalation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Publish pending status
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: 'pending',
              context: 'p7-incident/escalation-contract',
              description: 'Validazione escalation owner-visible in corso',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
      - name: Validate minimum incident escalation contract
        run: bash .github/scripts/validate-incident-escalation.sh
      - name: Publish final status
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const ok = process.env.JOB_STATUS === 'success'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: ok ? 'success' : 'failure',
              context: 'p7-incident/escalation-contract',
              description: ok ? 'Escalation owner-visible validata' : 'Escalation owner-visible non valida',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
