name: P7 Tier 2 Data Necessity Anonymization

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'ops/tier2-data-necessity-matrix.json'
      - 'docs/product/P7_TIER2_DATA_NECESSITY_AND_ANONYMIZATION.md'
      - '.github/scripts/validate-tier2-data-necessity-anonymization.mjs'
      - '.github/workflows/p7-tier2-data-necessity-anonymization.yml'
  push:
    branches:
      - develop
    paths:
      - 'ops/tier2-data-necessity-matrix.json'
      - 'docs/product/P7_TIER2_DATA_NECESSITY_AND_ANONYMIZATION.md'
      - '.github/scripts/validate-tier2-data-necessity-anonymization.mjs'
      - '.github/workflows/p7-tier2-data-necessity-anonymization.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate-tier2-data-necessity-anonymization:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate anonymization-first data necessity matrix
        run: node .github/scripts/validate-tier2-data-necessity-anonymization.mjs
      - name: Publish anonymization status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const ok = process.env.JOB_STATUS === 'success'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'p7-tier2/data-necessity-anonymization',
              description: ok ? 'D0-D1 only; no persistent student identity' : 'Anonymization/data necessity baseline invalid',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
