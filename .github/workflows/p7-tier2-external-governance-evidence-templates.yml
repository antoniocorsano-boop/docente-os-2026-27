name: P7 Tier 2 External Governance Evidence Templates

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'ops/tier2-external-governance-evidence-receipts.json'
      - 'docs/product/tier2-evidence-templates/**'
      - '.github/scripts/validate-tier2-external-governance-evidence-templates.mjs'
      - '.github/workflows/p7-tier2-external-governance-evidence-templates.yml'
  push:
    branches:
      - develop
    paths:
      - 'ops/tier2-external-governance-evidence-receipts.json'
      - 'docs/product/tier2-evidence-templates/**'
      - '.github/scripts/validate-tier2-external-governance-evidence-templates.mjs'
      - '.github/workflows/p7-tier2-external-governance-evidence-templates.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate-tier2-external-governance-evidence-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate E1-E4 evidence templates and receipt registry
        run: node .github/scripts/validate-tier2-external-governance-evidence-templates.mjs
      - name: Publish evidence-template gate status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const ok = process.env.JOB_STATUS === 'success'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'p7-tier2/external-evidence-templates',
              description: ok ? 'E1-E4 pronti, nessuna evidenza auto-approvata' : 'Contratto E1-E4 non coerente',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
