name: P7 Tier 2 Institutional Decision Matrix

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'ops/tier2-institutional-decision-matrix.json'
      - 'docs/product/P7_TIER2_INSTITUTIONAL_DECISIONS_REQUIRED.md'
      - '.github/scripts/validate-tier2-institutional-decision-matrix.mjs'
      - '.github/workflows/p7-tier2-institutional-decision-matrix.yml'
  push:
    branches:
      - develop
    paths:
      - 'ops/tier2-institutional-decision-matrix.json'
      - 'docs/product/P7_TIER2_INSTITUTIONAL_DECISIONS_REQUIRED.md'
      - '.github/scripts/validate-tier2-institutional-decision-matrix.mjs'
      - '.github/workflows/p7-tier2-institutional-decision-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate-tier2-institutional-decision-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Tier 2 institutional decision matrix
        run: node .github/scripts/validate-tier2-institutional-decision-matrix.mjs
      - name: Publish institutional decision matrix status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const ok = process.env.JOB_STATUS === 'success'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'p7-tier2/institutional-decision-matrix',
              description: ok ? '4 decisioni istituzionali esplicite, Tier 2 bloccato' : 'Matrice decisionale istituzionale non coerente',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
