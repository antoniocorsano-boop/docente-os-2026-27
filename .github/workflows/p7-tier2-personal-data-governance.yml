name: P7 Tier 2 Personal Data Governance

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'ops/tier2-personal-data-governance.json'
      - 'ops/real-data-admission-review.json'
      - '.github/scripts/validate-tier2-personal-data-governance.mjs'
      - '.github/workflows/p7-tier2-personal-data-governance.yml'
      - 'docs/product/P7_TIER2_PERSONAL_DATA_GOVERNANCE.md'
  push:
    branches:
      - develop
    paths:
      - 'ops/tier2-personal-data-governance.json'
      - 'ops/real-data-admission-review.json'
      - '.github/scripts/validate-tier2-personal-data-governance.mjs'
      - '.github/workflows/p7-tier2-personal-data-governance.yml'
      - 'docs/product/P7_TIER2_PERSONAL_DATA_GOVERNANCE.md'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate-tier2-personal-data-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Tier 2 personal-data governance
        run: node .github/scripts/validate-tier2-personal-data-governance.mjs
      - name: Publish Tier 2 governance status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const ok = process.env.JOB_STATUS === 'success'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'p7-tier2/personal-data-governance',
              description: ok ? 'Tier 2 governance foundation coerente' : 'Tier 2 governance foundation non coerente',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
