name: P7 Tier 2 Privacy Review

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'ops/tier2-dedicated-privacy-review.json'
      - 'ops/tier2-processor-transfer-review.json'
      - 'ops/tier2-personal-data-governance.json'
      - '.github/scripts/validate-tier2-privacy-review.mjs'
      - '.github/scripts/validate-tier2-personal-data-governance.mjs'
      - '.github/scripts/validate-tier2-retention-deletion.mjs'
      - '.github/scripts/validate-tier2-export-deletion.mjs'
      - '.github/workflows/p7-tier2-privacy-review.yml'
      - 'docs/product/P7_TIER2_DEDICATED_PRIVACY_REVIEW.md'
  push:
    branches:
      - develop
    paths:
      - 'ops/tier2-dedicated-privacy-review.json'
      - 'ops/tier2-processor-transfer-review.json'
      - 'ops/tier2-personal-data-governance.json'
      - '.github/scripts/validate-tier2-privacy-review.mjs'
      - '.github/scripts/validate-tier2-personal-data-governance.mjs'
      - '.github/scripts/validate-tier2-retention-deletion.mjs'
      - '.github/scripts/validate-tier2-export-deletion.mjs'
      - '.github/workflows/p7-tier2-privacy-review.yml'
      - 'docs/product/P7_TIER2_DEDICATED_PRIVACY_REVIEW.md'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate-tier2-privacy-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Tier 2 dedicated privacy review
        run: node .github/scripts/validate-tier2-privacy-review.mjs
      - name: Publish T2D privacy review status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const ok = process.env.JOB_STATUS === 'success'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'p7-tier2/privacy-review',
              description: ok ? 'T2D review coerente e Tier 2 bloccato' : 'T2D privacy review non coerente',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
