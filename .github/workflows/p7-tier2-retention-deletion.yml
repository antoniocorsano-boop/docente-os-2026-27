name: P7 Tier 2 Retention Deletion

on:
  pull_request:
    branches: [develop]
    paths:
      - 'ops/tier2-application-retention-deletion-policy.json'
      - 'ops/tier2-personal-data-governance.json'
      - 'ops/real-data-admission-review.json'
      - '.github/scripts/validate-tier2-retention-deletion.mjs'
      - '.github/workflows/p7-tier2-retention-deletion.yml'
      - 'docs/product/P7_TIER2_RETENTION_DELETION.md'
  push:
    branches: [develop]
    paths:
      - 'ops/tier2-application-retention-deletion-policy.json'
      - 'ops/tier2-personal-data-governance.json'
      - 'ops/real-data-admission-review.json'
      - '.github/scripts/validate-tier2-retention-deletion.mjs'
      - '.github/workflows/p7-tier2-retention-deletion.yml'
      - 'docs/product/P7_TIER2_RETENTION_DELETION.md'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate-tier2-retention-deletion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node .github/scripts/validate-tier2-retention-deletion.mjs
      - name: Publish T2B status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const ok = process.env.JOB_STATUS === 'success'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'p7-tier2/retention-deletion',
              description: ok ? 'T2B retention/deletion coerente' : 'T2B retention/deletion non coerente',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
