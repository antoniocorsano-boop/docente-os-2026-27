name: Pilot Evidence Policy

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
    paths:
      - 'docs/product/SUSTAINED_PILOT_EVIDENCE_CANONICAL.md'
      - 'docs/product/M5_READINESS_MATRIX_2026-09-12.md'
      - 'ops/pilot-evidence-policy.json'
      - 'ops/pilot-evidence-ledger.json'
      - '.github/scripts/validate-pilot-evidence-policy.mjs'
      - '.github/workflows/pilot-evidence-policy.yml'
      - 'CHANGELOG.md'
      - 'docs/product/CANONICAL_DOC_INDEX.md'
  push:
    branches:
      - develop
    paths:
      - 'docs/product/SUSTAINED_PILOT_EVIDENCE_CANONICAL.md'
      - 'docs/product/M5_READINESS_MATRIX_2026-09-12.md'
      - 'ops/pilot-evidence-policy.json'
      - 'ops/pilot-evidence-ledger.json'
      - '.github/scripts/validate-pilot-evidence-policy.mjs'
      - '.github/workflows/pilot-evidence-policy.yml'
      - 'CHANGELOG.md'
      - 'docs/product/CANONICAL_DOC_INDEX.md'

permissions:
  contents: read
  statuses: write

jobs:
  validate-pilot-evidence-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v6
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate sustained pilot evidence
        run: node .github/scripts/validate-pilot-evidence-policy.mjs
      - name: Publish pilot evidence status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const ok = process.env.JOB_STATUS === 'success'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'm5/pilot-evidence',
              description: ok ? 'Pilot evidence policy valida' : 'Pilot evidence policy non valida',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
