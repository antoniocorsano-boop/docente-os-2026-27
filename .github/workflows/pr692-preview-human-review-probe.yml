name: PR692 Preview Human Review Probe

on:
  push:
    branches:
      - probe/pr692-preview-human-review-v2

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run preview probe
        env:
          TARGET_URL: https://docente-os-pr692-atlas.onrender.com
          E2E_EMAIL: ${{ secrets.DOCENTE_OS_PRODUCTION_E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.DOCENTE_OS_PRODUCTION_E2E_PASSWORD }}
        run: |
          mkdir -p product/test-results/pr692-preview
          cat > product/pr692-probe.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';

          const out=process.cwd()+'/test-results/pr692-preview';
          const browser=await chromium.launch({headless:true});
          const report=[];

          async function snap(page,name){
            const text=(await page.locator('body').innerText()).slice(0,5000);
            const links=await page.locator('a').evaluateAll(nodes => nodes.slice(0,80).map(a => ({text:(a.textContent||'').trim(),href:a.href})));
            await page.screenshot({path:`${out}/${name}.png`,fullPage:true});
            report.push({name,url:page.url(),title:await page.title(),text,links});
          }

          async function visible(locator){
            return await locator.count() > 0 && await locator.first().isVisible().catch(()=>false);
          }

          async function login(page, suffix){
            await page.goto(process.env.TARGET_URL,{waitUntil:'networkidle',timeout:60000});
            if(!page.url().includes('/login')) return true;
            if(!process.env.E2E_EMAIL || !process.env.E2E_PASSWORD){
              report.push({name:`missing-e2e-credentials-${suffix}`,url:page.url()});
              return false;
            }
            await page.locator('#email').fill(process.env.E2E_EMAIL);
            await page.locator('#password').fill(process.env.E2E_PASSWORD);
            await page.getByRole('button',{name:/Entra nel tuo spazio docente/i}).click();
            await page.waitForLoadState('networkidle',{timeout:15000}).catch(()=>{});
            await page.waitForTimeout(1000);
            if(page.url().includes('/mfa')){
              await snap(page,`01b-mfa-${suffix}`);
              report.push({name:`blocked-mfa-${suffix}`,url:page.url()});
              return false;
            }
            if(page.url().includes('/login')){
              await snap(page,`01b-login-failed-${suffix}`);
              report.push({name:`blocked-login-${suffix}`,url:page.url()});
              return false;
            }
            await snap(page,`02-authenticated-home-${suffix}`);
            return true;
          }

          async function openFirstUdaAuthoring(page,suffix){
            await page.goto(`${process.env.TARGET_URL}/progetta`,{waitUntil:'networkidle',timeout:60000});
            await snap(page,`03-progetta-${suffix}`);
            const authoring=page.getByRole('link',{name:/Prepara documento/i}).first();
            if(await visible(authoring)){
              await authoring.click();
              await page.waitForLoadState('networkidle',{timeout:12000}).catch(()=>{});
              await snap(page,`04-uda-gate-${suffix}`);
              return true;
            }
            return false;
          }

          async function openFocusedUdaFromClass(page,suffix){
            await page.goto(`${process.env.TARGET_URL}/classi`,{waitUntil:'networkidle',timeout:60000});
            await snap(page,`05-classi-${suffix}`);
            const classLink=page.locator('a[href^="/classi/"]').filter({hasNot:page.locator('a[href*="lezioni"]')}).first();
            if(!await visible(classLink)) return false;
            await classLink.click();
            await page.waitForLoadState('networkidle',{timeout:12000}).catch(()=>{});
            await snap(page,`06-class-workspace-${suffix}`);
            const focused=page.locator('a[href*="/progetta?grade="]').first();
            if(!await visible(focused)) return false;
            await focused.click();
            await page.waitForLoadState('networkidle',{timeout:12000}).catch(()=>{});
            await snap(page,`07-focused-progetta-${suffix}`);
            const prep=page.getByRole('link',{name:/Prepara documento/i}).first();
            if(!await visible(prep)) return false;
            await prep.click();
            await page.waitForLoadState('networkidle',{timeout:12000}).catch(()=>{});
            await snap(page,`08-focused-uda-gate-${suffix}`);
            return true;
          }

          async function tryAtlas(page,suffix){
            const atlas=page.getByRole('link',{name:/Prepara materiali con Atlas/i}).first();
            if(!await visible(atlas)){
              report.push({name:`atlas-link-unavailable-${suffix}`,url:page.url(),text:(await page.locator('body').innerText()).slice(0,3000)});
              return false;
            }
            await atlas.click();
            await page.waitForLoadState('networkidle',{timeout:15000}).catch(()=>{});
            await page.waitForTimeout(1000);
            await snap(page,`09-studio-atlas-${suffix}`);
            return true;
          }

          for (const cfg of [
            {name:'desktop',viewport:{width:1440,height:1000}},
            {name:'mobile',viewport:{width:390,height:844}}
          ]) {
            const page=await browser.newPage({viewport:cfg.viewport});
            const authenticated=await login(page,cfg.name);
            if(!authenticated){ await page.close(); continue; }
            const generic=await openFirstUdaAuthoring(page,cfg.name);
            let atlasReady=false;
            if(generic) atlasReady=await tryAtlas(page,`${cfg.name}-generic`);
            if(!atlasReady){
              const focused=await openFocusedUdaFromClass(page,cfg.name);
              if(focused) await tryAtlas(page,`${cfg.name}-focused`);
            }
            await page.close();
          }

          await fs.writeFile(`${out}/report.json`,JSON.stringify(report,null,2));
          await browser.close();
          EOF
          cd product
          node pr692-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr692-preview-human-review
          path: product/test-results/pr692-preview
          if-no-files-found: error
