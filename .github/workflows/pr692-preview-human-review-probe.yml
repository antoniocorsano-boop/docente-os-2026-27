name: PR692 Preview Human Review Probe

on:
  push:
    branches:
      - probe/pr692-preview-human-review-v2

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run preview probe
        env:
          TARGET_URL: https://docente-os-pr692-atlas.onrender.com
        run: |
          mkdir -p product/test-results/pr692-preview
          cat > product/pr692-probe.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';
          const out=process.cwd()+'/test-results/pr692-preview';
          const browser=await chromium.launch({headless:true});
          const report=[];
          async function snap(page,name){
            await page.screenshot({path:`${out}/${name}.png`,fullPage:true});
            report.push({name,url:page.url(),title:await page.title(),text:(await page.locator('body').innerText()).slice(0,4000)});
          }
          async function clickText(page, texts){
            for (const t of texts) {
              const el=page.getByText(t,{exact:false}).first();
              if(await el.count() && await el.isVisible().catch(()=>false)){
                await el.click().catch(()=>{});
                await page.waitForLoadState('networkidle',{timeout:8000}).catch(()=>{});
                return t;
              }
            }
            return null;
          }
          for (const cfg of [
            {name:'desktop',viewport:{width:1440,height:1000}},
            {name:'mobile',viewport:{width:390,height:844}}
          ]) {
            const page=await browser.newPage({viewport:cfg.viewport});
            await page.goto(process.env.TARGET_URL,{waitUntil:'networkidle',timeout:60000});
            await snap(page,`01-home-${cfg.name}`);
            const body=(await page.locator('body').innerText()).toLowerCase();
            if(body.includes('accedi')||body.includes('login')||body.includes('password')){
              report.push({name:`blocked-auth-${cfg.name}`,url:page.url()});
              await page.close(); continue;
            }
            await clickText(page,['Progetta']);
            await snap(page,`02-progetta-${cfg.name}`);
            const uda=await clickText(page,['UDA','Unità di apprendimento']);
            if(uda){ await snap(page,`03-uda-${cfg.name}`); }
            const prep=await clickText(page,['Prepara materiali con Atlas']);
            if(prep){ await snap(page,`04-atlas-entry-${cfg.name}`); }
            const options=['Presentazione','Scheda di lavoro','Guida','Rubrica'];
            for(const o of options){
              const el=page.getByText(o,{exact:false}).first();
              if(await el.count() && await el.isVisible().catch(()=>false)) await el.click().catch(()=>{});
            }
            const cont=await clickText(page,['Continua con']);
            if(cont){ await snap(page,`05-atlas-selection-${cfg.name}`); }
            const assoc=await clickText(page,['Associa alla lezione']);
            if(assoc){ await snap(page,`06-associated-${cfg.name}`); }
            if((await page.locator('body').innerText()).includes('Materiali allegati')) await snap(page,`07-materials-attached-${cfg.name}`);
            await page.close();
          }
          await fs.writeFile(`${out}/report.json`,JSON.stringify(report,null,2));
          await browser.close();
          EOF
          cd product
          node pr692-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr692-preview-human-review
          path: test-results/pr692-preview
          if-no-files-found: error
