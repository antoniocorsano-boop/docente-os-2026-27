name: Product CI

on:
  push:
    branches: ["main", "develop"]
    paths:
      - "product/**"
      - ".github/workflows/product-ci.yml"
      - ".github/scripts/p0-supabase-ci-isolation.mjs"
  pull_request:
    paths:
      - "product/**"
      - ".github/workflows/product-ci.yml"
      - ".github/scripts/p0-supabase-ci-isolation.mjs"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: product
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Block remote Supabase access in routine Product CI (P0)
        run: |
          node ../.github/scripts/p0-supabase-ci-isolation.mjs --self-test
          node ../.github/scripts/p0-supabase-ci-isolation.mjs --check
          if NEXT_PUBLIC_SUPABASE_URL='https://fictional-live.supabase.co' node ../.github/scripts/p0-supabase-ci-isolation.mjs --check >/dev/null 2>&1; then
            echo 'ERROR: remote Supabase endpoint was accepted by the CI guard' >&2
            exit 1
          fi
          echo 'P0_CI_REMOTE_SUPABASE_NEGATIVE_TEST=PASS'
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
