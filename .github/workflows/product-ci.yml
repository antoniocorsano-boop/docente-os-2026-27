name: Product CI

on:
  push:
    branches: ["main", "develop"]
    paths:
      - "product/**"
      - ".github/workflows/product-ci.yml"
  pull_request:
    paths:
      - "product/**"
      - ".github/workflows/product-ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: product
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
