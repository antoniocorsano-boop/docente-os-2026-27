name: Product CI

on:
  push:
    branches: ["main", "develop"]
    paths:
      - "product/**"
      - "render.yaml"
      - ".github/workflows/product-ci.yml"
      - ".github/workflows/experience-acceptance.yml"
      - ".github/workflows/browser-certification-orchestrator.yml"
      - ".github/workflows/certification-impact.yml"
      - ".github/scripts/certification/**"
      - ".github/scripts/runtime-release-contract.mjs"
      - ".github/scripts/runtime-release-contract.test.mjs"
      - "ops/runtime-release-contract.json"
      - "ops/trama-perceptible-write.json"
      - "tools/trama-perceptible-write/**"
      - "docs/architecture/CERTIFICATION_PIPELINE_V2_CANONICAL.md"
      - "docs/architecture/RUNTIME_RELEASE_CONTRACT_V1.md"
      - "ops/trama-perceptible-write.json"
      - "tools/trama-perceptible-write/**"
  pull_request:
    paths:
      - "product/**"
      - "render.yaml"
      - ".github/workflows/product-ci.yml"
      - ".github/workflows/experience-acceptance.yml"
      - ".github/workflows/browser-certification-orchestrator.yml"
      - ".github/workflows/certification-impact.yml"
      - ".github/scripts/certification/**"
      - ".github/scripts/runtime-release-contract.mjs"
      - ".github/scripts/runtime-release-contract.test.mjs"
      - "ops/runtime-release-contract.json"
      - "docs/architecture/CERTIFICATION_PIPELINE_V2_CANONICAL.md"
      - "docs/architecture/RUNTIME_RELEASE_CONTRACT_V1.md"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: product
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Validate Render deployment contract
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^[[:space:]]*- name:[[:space:]]+Docente OS[[:space:]]*$' render.yaml
          grep -Eq '^[[:space:]]*- name:[[:space:]]+Beta[[:space:]]*$' render.yaml
          grep -Eq '^[[:space:]]+name:[[:space:]]+docente-os-2026-27-beta[[:space:]]*$' render.yaml
          grep -Fq 'repo: https://github.com/antoniocorsano-boop/docente-os-2026-27' render.yaml
          grep -Eq '^[[:space:]]+branch:[[:space:]]+develop[[:space:]]*$' render.yaml
          grep -Eq '^[[:space:]]+rootDir:[[:space:]]+product[[:space:]]*$' render.yaml
          grep -Eq '^[[:space:]]+autoDeployTrigger:[[:space:]]+commit[[:space:]]*$' render.yaml
          if grep -Eq '^[[:space:]]+autoDeployTrigger:[[:space:]]+(checksPass|off)[[:space:]]*$' render.yaml; then
            echo 'Render auto-deploy must remain On Commit: checksPass/off would break the exact-commit runtime gate.' >&2
            exit 1
          fi
          grep -A1 -F 'key: GROQ_STT_API_KEY' render.yaml | grep -Fq 'sync: false'
          if grep -Fq 'key: GROQ_API_KEY' render.yaml; then
            echo 'Beta Voice must not declare the shared GROQ_API_KEY: STT uses an isolated credential.' >&2
            exit 1
          fi
          if grep -Fq 'key: OPENAI_STT_API_KEY' render.yaml; then
            echo 'Beta Voice must not retain the legacy OpenAI STT credential.' >&2
            exit 1
          fi
          if grep -Fq 'key: OPENAI_API_KEY' render.yaml; then
            echo 'Beta Voice must not declare the shared OPENAI_API_KEY: unrelated OpenAI capabilities remain isolated.' >&2
            exit 1
          fi
          grep -Fq 'key: GROQ_TRANSCRIPTION_MODEL' render.yaml
          grep -Fq 'value: whisper-large-v3-turbo' render.yaml
          grep -Fq 'key: DOCENTE_OS_VOICE_CAPTURE' render.yaml
          grep -Fq 'value: on' render.yaml
          grep -A1 -F 'key: DOCENTE_OS_RUNTIME_SCHEMA_PREFLIGHT' render.yaml | grep -Fq 'value: on'
      - name: Validate Human + Visual Acceptance contract
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          test -f product/design/HUMAN-EXPERIENCE-CONTRACT.md
          test -f product/design/DESIGN.md
          test -f product/design/VISUAL-ACCEPTANCE.md
          test -f product/playwright.experience.config.mjs
          test -f product/e2e/experience/surfaces.spec.mjs
          test -f product/e2e/experience/accessibility.spec.mjs
          test -f product/scripts/experience/wait-for-target.mjs
          test -f product/scripts/experience/acceptance-report.mjs
          test -f .github/workflows/experience-acceptance.yml
          test -f .github/workflows/browser-certification-orchestrator.yml
          grep -Fq "context: 'hva/application'" .github/workflows/experience-acceptance.yml
          grep -Fq "context: 'hva/runtime'" .github/workflows/experience-acceptance.yml
          grep -Fq 'retention-days: 90' .github/workflows/experience-acceptance.yml
          grep -Fq "visual: 'REVIEW_REQUIRED'" product/scripts/experience/acceptance-report.mjs
          grep -Fq "const wcagAssurance = process.env.WCAG_ASSURANCE === '1'" product/playwright.experience.config.mjs
          grep -Fq "testIgnore: wcagAssurance ? [] : '**/accessibility.spec.mjs'" product/playwright.experience.config.mjs
          grep -Fq "WCAG_ASSURANCE: '1'" .github/workflows/browser-certification-orchestrator.yml
          grep -Fq 'e2e/experience/accessibility.spec.mjs' .github/workflows/browser-certification-orchestrator.yml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate TRAMA Perceptible Write contract
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          TRAMA_PW_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          TRAMA_PW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tools/trama-perceptible-write/validate.mjs

      - name: Validate Certification Pipeline V2 foundation
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          node --test .github/scripts/certification/*.test.mjs
          node --test .github/scripts/runtime-release-contract.test.mjs
          test -f ops/runtime-release-contract.json
          test -f product/supabase/migrations/0074_runtime_schema_contract.sql
          test -f product/supabase/tests/runtime-release-contract.sql
          test -f .github/workflows/browser-certification-orchestrator.yml
          grep -Fq 'browser-certification-preflight' .github/workflows/browser-certification-orchestrator.yml
          grep -Fq 'browser-certification-selected-gates' .github/workflows/browser-certification-orchestrator.yml
          grep -Fq 'docente-os-pr-governed-mfa-e2e' .github/workflows/browser-certification-orchestrator.yml
          grep -Fq "context: statusContext" .github/workflows/browser-certification-orchestrator.yml
          grep -Fq 'orchestrationAuthorized: true' .github/scripts/certification/classifier.mjs
          grep -Fq 'mergeAuthorized: false' .github/scripts/certification/classifier.mjs
      - name: Evaluate selective runtime release impact
        id: runtime_impact
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          RUNTIME_CONTRACT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          RUNTIME_CONTRACT_TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUNTIME_RELEASE_CONTRACT_OUTPUT: test-results/release-runtime-contract/impact.json
        run: |
          set -euo pipefail
          node .github/scripts/runtime-release-contract.mjs
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs')
          const r = JSON.parse(fs.readFileSync('test-results/release-runtime-contract/impact.json', 'utf8'))
          console.log('database_deep=' + String(r.databaseDeep))
          console.log('critical_write=' + String(r.criticalWrite))
          console.log('capability_runtime=' + String(r.capabilityRuntime))
          console.log('latest_migration=' + r.latestMigrationId)
          NODE

      - name: Set up Supabase CLI for deep DB replay
        if: steps.runtime_impact.outputs.database_deep == 'true'
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: latest

      - name: Replay complete migration chain on ephemeral Supabase
        if: steps.runtime_impact.outputs.database_deep == 'true'
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/docente-os-runtime-db"
          rm -rf "$work"
          mkdir -p "$work"
          cd "$work"
          supabase init
          rm -rf supabase/migrations
          mkdir -p supabase/migrations

          # Historical repository migrations contain duplicated numeric prefixes
          # (0023, 0024, 0029). Supabase CLI requires unique migration versions.
          # For the ephemeral replay only, preserve lexical SQL order while assigning
          # synthetic unique versions. Canonical filenames and live history are untouched.
          i=1
          while IFS= read -r src; do
            version="$(printf '%014d' "$i")"
            stem="$(basename "$src" .sql)"
            cp "$src" "supabase/migrations/${version}_${stem}.sql"
            i=$((i + 1))
          done < <(find "$GITHUB_WORKSPACE/product/supabase/migrations" -maxdepth 1 -type f -name '*.sql' | sort)

          supabase db start
          trap 'supabase stop --no-backup >/dev/null 2>&1 || true' EXIT
          supabase db reset --local --no-seed

          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi

          db_url="$(supabase status -o env | sed -n 's/^DB_URL=//p' | tr -d '"' | head -n 1)"
          test -n "$db_url"
          psql "$db_url" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/product/supabase/tests/runtime-release-contract.sql"

          actual="$(psql "$db_url" -Atc "select migration_id from public.runtime_schema_contract_state where singleton")"
          expected="${{ steps.runtime_impact.outputs.latest_migration }}"
          echo "runtime schema watermark: actual=$actual expected=$expected"
          test "$actual" = "$expected"

      - name: Publish runtime release preflight receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-release-contract-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 90
          path: test-results/release-runtime-contract/impact.json

      - name: Validate HVA script syntax
        run: |
          node --check scripts/experience/wait-for-target.mjs
          node --check scripts/experience/acceptance-report.mjs
          node --check e2e/support/e2e-auth.mjs
          node --check e2e/support/experience-observer.mjs
          node --check e2e/experience/surfaces.mjs
          node --check e2e/experience/surfaces.spec.mjs
          node --check playwright.experience.config.mjs
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
