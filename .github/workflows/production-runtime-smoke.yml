name: Production Runtime Smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Inactive Production Render URL
        required: true
        type: string

permissions:
  contents: read
  statuses: write

env:
  PRODUCTION_BASE_URL: ${{ inputs.base_url }}
  PRODUCTION_SUPABASE_URL: ${{ secrets.DOCENTE_OS_PRODUCTION_SUPABASE_URL }}
  PRODUCTION_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.DOCENTE_OS_PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
  PRODUCTION_E2E_EMAIL: ${{ secrets.DOCENTE_OS_PRODUCTION_E2E_EMAIL }}
  PRODUCTION_E2E_PASSWORD: ${{ secrets.DOCENTE_OS_PRODUCTION_E2E_PASSWORD }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish pending Production smoke status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'production-runtime/smoke',
              description: 'Smoke Production inattiva in esecuzione',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
      - name: Run non-mutating Production smoke
        run: node .github/scripts/production-runtime-smoke.mjs
      - name: Publish final Production smoke status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const ok = process.env.JOB_STATUS === 'success'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'production-runtime/smoke',
              description: ok ? 'Smoke Production inattiva verificato' : 'Smoke Production non superato',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
