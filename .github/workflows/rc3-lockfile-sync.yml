name: RC3 Lockfile Sync One-Shot

on:
  push:
    branches:
      - release/0.1.0-rc.3-prep
    paths:
      - .github/workflows/rc3-lockfile-sync.yml
      - product/package.json
      - product/package-lock.json

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/0.1.0-rc.3-prep
          fetch-depth: 0

      - name: Synchronize rc.3 lockfile metadata only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('product/package-lock.json')
          s = p.read_text()
          old = '"version": "0.1.0-rc.2"'
          new = '"version": "0.1.0-rc.3"'
          count = s.count(old)
          if count != 2:
              raise SystemExit(f'expected exactly 2 rc.2 version markers in lockfile, found {count}')
          s2 = s.replace(old, new, 2)
          if s2.count(old) != 0:
              raise SystemExit('unexpected residual rc.2 lockfile version marker')
          p.write_text(s2)
          PY

          node - <<'NODE'
          const fs = require('node:fs')
          const pkg = JSON.parse(fs.readFileSync('product/package.json','utf8'))
          const lock = JSON.parse(fs.readFileSync('product/package-lock.json','utf8'))
          if (pkg.version !== '0.1.0-rc.3') throw new Error(`package version ${pkg.version}`)
          if (lock.version !== '0.1.0-rc.3') throw new Error(`lock version ${lock.version}`)
          if (lock.packages?.['']?.version !== '0.1.0-rc.3') throw new Error(`lock root version ${lock.packages?.['']?.version}`)
          NODE

          git diff --check
          git diff -- product/package-lock.json

      - name: Commit synchronized lockfile and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/rc3-lockfile-sync.yml
          git add product/package-lock.json
          git diff --cached --check
          git commit -m 'chore: synchronize rc3 lockfile metadata'
          git push origin HEAD:release/0.1.0-rc.3-prep
