name: Render Production Blueprint

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
    paths:
      - 'ops/render-production-blueprint.yaml'
      - '.github/scripts/validate-render-production-blueprint.mjs'
      - '.github/scripts/production-runtime-smoke.mjs'
      - '.github/workflows/render-production-blueprint.yml'
      - '.github/workflows/production-runtime-smoke.yml'
      - 'docs/product/P7F2_RENDER_PRODUCTION_HANDOFF.md'
  push:
    branches:
      - develop
    paths:
      - 'ops/render-production-blueprint.yaml'
      - '.github/scripts/validate-render-production-blueprint.mjs'
      - '.github/scripts/production-runtime-smoke.mjs'
      - '.github/workflows/render-production-blueprint.yml'
      - '.github/workflows/production-runtime-smoke.yml'
      - 'docs/product/P7F2_RENDER_PRODUCTION_HANDOFF.md'

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate isolated Render Production blueprint
        run: node .github/scripts/validate-render-production-blueprint.mjs
      - name: Validate Production smoke script syntax
        run: node --check .github/scripts/production-runtime-smoke.mjs
      - name: Publish Render Production handoff status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const ok = process.env.JOB_STATUS === 'success'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'production-render/blueprint',
              description: ok ? 'Blueprint Production Render valido' : 'Blueprint Production Render non valido',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
