name: TRAMA TERM-01 Curricolo Vocabulary

on:
  pull_request:

permissions:
  contents: read

jobs:
  vocabulary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Audit current vocabulary baseline
        run: node scripts/test-curricolo-vocabulary-baseline.mjs
