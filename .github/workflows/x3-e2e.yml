name: X3 E2E Mobile Gate

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/x3-e2e.yml'
      - 'product/e2e/**'
      - 'product/playwright.config.mjs'
      - 'product/src/app/api/build-info/**'
      - 'product/src/app/api/assistant/**'
      - 'product/src/app/assistant.css'
      - 'product/src/components/assistant/**'
      - 'product/src/core/presentation/*assistant-context.ts'
      - 'product/src/core/presentation/*assistant-context.test.ts'
      - 'product/src/app/knowledge/**'
      - 'product/src/app/planner/**'

permissions:
  contents: read
  statuses: write

concurrency:
  group: x3-e2e-beta
  cancel-in-progress: true

env:
  E2E_EMAIL: docente-os-e2e-2dbf49e1@example.invalid
  E2E_PASSWORD: ${{ secrets.DOCENTE_OS_E2E_PASSWORD }}

jobs:
  x3-application-acceptance:
    name: x3-application-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: https://gnshgapmwyjamhmlikeg.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_4Hqwe3dIqEWGrqSZmmQB8w_TgsfKc7L
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000

    steps:
      - name: Check E2E credential configuration
        id: credentials
        shell: bash
        run: |
          if [ -n "${E2E_PASSWORD:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Authenticated X3 application gate is configured." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "## X3 application gate not executed"
              echo "Repository secret \`DOCENTE_OS_E2E_PASSWORD\` is not configured."
              echo "No application check was bypassed or reported as passed."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish pending application status
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'x3-e2e/application',
              description: 'Gate X3 applicativo in esecuzione',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })

      - name: Checkout tested commit
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up Node 22
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install product dependencies
        if: steps.credentials.outputs.ready == 'true'
        working-directory: product
        run: npm install --no-audit --no-fund

      - name: Install Playwright runner without changing the lockfile
        if: steps.credentials.outputs.ready == 'true'
        working-directory: product
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Build tested application
        if: steps.credentials.outputs.ready == 'true'
        working-directory: product
        run: npm run build

      - name: Start tested application
        if: steps.credentials.outputs.ready == 'true'
        working-directory: product
        shell: bash
        run: |
          npm start > /tmp/docente-os-e2e-server.log 2>&1 &
          echo $! > /tmp/docente-os-e2e-server.pid
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 "$E2E_BASE_URL/login" >/dev/null; then
              echo "Local DOCENTE OS runtime is ready."
              exit 0
            fi
            sleep 2
          done
          echo "Local DOCENTE OS runtime did not become ready." >&2
          cat /tmp/docente-os-e2e-server.log >&2 || true
          exit 1

      - name: Install Chromium
        if: steps.credentials.outputs.ready == 'true'
        working-directory: product
        run: npx playwright install --with-deps chromium

      - name: Run X3 application acceptance gate
        if: steps.credentials.outputs.ready == 'true'
        working-directory: product
        run: npx playwright test --config=playwright.config.mjs e2e/x3-acceptance.spec.mjs

      - name: Publish application browser evidence
        if: always() && steps.credentials.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: x3-application-evidence-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            product/playwright-report/
            product/test-results/
            /tmp/docente-os-e2e-server.log

      - name: Publish final application status
        if: always()
        uses: actions/github-script@v7
        env:
          GATE_READY: ${{ steps.credentials.outputs.ready }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const ready = process.env.GATE_READY === 'true'
            const jobStatus = process.env.JOB_STATUS
            const state = !ready ? 'error' : jobStatus === 'success' ? 'success' : 'failure'
            const description = !ready
              ? 'Gate X3 applicativo non eseguito: credenziale mancante'
              : state === 'success'
                ? 'Gate X3 applicativo superato'
                : 'Gate X3 applicativo non superato'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'x3-e2e/application',
              description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })

  x3-render-acceptance:
    name: x3-render-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_BASE_URL: https://docente-os-2026-27-beta.onrender.com

    steps:
      - name: Check E2E credential configuration
        id: credentials
        shell: bash
        run: |
          if [ -n "${E2E_PASSWORD:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Authenticated X3 Render gate is configured." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "## X3 Render gate not executed"
              echo "Repository secret \`DOCENTE_OS_E2E_PASSWORD\` is not configured."
              echo "No runtime check was bypassed or reported as passed."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish pending Render status
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'x3-e2e/render-beta',
              description: 'Gate X3 Render in esecuzione',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })

      - name: Checkout tested commit
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up Node 22
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wait for Render to serve this exact commit
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          expected="$GITHUB_SHA"
          last_http="000"
          last_deployed=""
          rm -f /tmp/render-gate-reason
          for attempt in $(seq 1 120); do
            : > /tmp/build-info.json
            http_code="$(curl -sS --max-time 20 -o /tmp/build-info.json -w '%{http_code}' "$E2E_BASE_URL/api/build-info" 2>/dev/null || true)"
            [ -n "$http_code" ] || http_code="000"
            payload="$(cat /tmp/build-info.json 2>/dev/null || true)"
            deployed="$(printf '%s' "$payload" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).commit||'')}catch{console.log('')}})" )"
            last_http="$http_code"
            last_deployed="$deployed"
            echo "Attempt $attempt/120: http=$http_code, deployed=${deployed:-unavailable}, expected=$expected"
            if [ "$deployed" = "$expected" ]; then
              echo "Render is serving the exact commit under test."
              exit 0
            fi
            sleep 15
          done
          printf 'DEPLOY_STALE http=%s deployed=%s expected=%s\n' "$last_http" "${last_deployed:-unavailable}" "$expected" > /tmp/render-gate-reason
          echo "Render did not expose the expected commit within 30 minutes; browser acceptance was not executed." >&2
          exit 1

      - name: Install product dependencies
        if: steps.credentials.outputs.ready == 'true'
        working-directory: product
        run: npm install --no-audit --no-fund

      - name: Install Playwright runner without changing the lockfile
        if: steps.credentials.outputs.ready == 'true'
        working-directory: product
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Chromium
        if: steps.credentials.outputs.ready == 'true'
        working-directory: product
        run: npx playwright install --with-deps chromium

      - name: Run X3 Render acceptance gate
        if: steps.credentials.outputs.ready == 'true'
        working-directory: product
        run: npx playwright test --config=playwright.config.mjs e2e/x3-acceptance.spec.mjs

      - name: Publish Render browser evidence
        if: always() && steps.credentials.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: x3-render-evidence-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            product/playwright-report/
            product/test-results/
            /tmp/render-gate-reason

      - name: Publish final Render status
        if: always()
        uses: actions/github-script@v7
        env:
          GATE_READY: ${{ steps.credentials.outputs.ready }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require('fs')
            const ready = process.env.GATE_READY === 'true'
            const jobStatus = process.env.JOB_STATUS
            const deployStale = fs.existsSync('/tmp/render-gate-reason')
            const state = !ready || deployStale ? 'error' : jobStatus === 'success' ? 'success' : 'failure'
            const description = !ready
              ? 'Gate X3 Render non eseguito: credenziale mancante'
              : deployStale
                ? 'Render non allineato al commit: browser non eseguito'
                : state === 'success'
                  ? 'Gate X3 superato sul beta Render'
                  : 'Gate X3 applicativo non superato sul beta Render'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'x3-e2e/render-beta',
              description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
