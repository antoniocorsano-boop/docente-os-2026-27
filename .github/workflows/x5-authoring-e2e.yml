name: X5 UDA Versioned Authoring Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
    paths:
      - 'product/e2e/x5-uda-authoring.spec.mjs'
      - 'product/playwright.config.mjs'
      - 'product/src/app/progetta/**'
      - 'product/src/core/domain/authored-document.ts'
      - 'product/src/core/infrastructure/supabase/supabase-authored-document-repository.ts'
      - 'product/supabase/migrations/0030_versioned_uda_authoring.sql'
      - 'product/supabase/migrations/0031_authored_document_discard.sql'
      - '.github/workflows/x5-authoring-e2e.yml'
  push:
    branches:
      - develop
    paths:
      - 'product/e2e/x5-uda-authoring.spec.mjs'
      - 'product/playwright.config.mjs'
      - 'product/src/app/progetta/**'
      - 'product/src/core/domain/authored-document.ts'
      - 'product/src/core/infrastructure/supabase/supabase-authored-document-repository.ts'
      - 'product/supabase/migrations/0030_versioned_uda_authoring.sql'
      - 'product/supabase/migrations/0031_authored_document_discard.sql'
      - '.github/workflows/x5-authoring-e2e.yml'

permissions:
  contents: read
  statuses: write

env:
  E2E_EMAIL: docente-os-e2e-2dbf49e1@example.invalid
  E2E_PASSWORD: ${{ secrets.DOCENTE_OS_E2E_PASSWORD }}
  NEXT_PUBLIC_SUPABASE_URL: https://gnshgapmwyjamhmlikeg.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_4Hqwe3dIqEWGrqSZmmQB8w_TgsfKc7L

jobs:
  x5-application-acceptance:
    if: github.event_name == 'pull_request'
    name: x5-application-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      E2E_BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000

    steps:
      - name: Check E2E credential configuration
        shell: bash
        run: |
          if [ -z "${E2E_PASSWORD:-}" ]; then
            echo 'Repository secret DOCENTE_OS_E2E_PASSWORD is required.' >&2
            exit 1
          fi

      - name: Publish pending X5 application status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'x5-authoring/application',
              description: 'Gate X5 authoring UDA in esecuzione',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })

      - name: Checkout tested commit
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install product dependencies
        working-directory: product
        run: npm install --no-audit --no-fund

      - name: Install Playwright runner without changing the lockfile
        working-directory: product
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Build tested application
        working-directory: product
        run: npm run build

      - name: Start tested application
        working-directory: product
        shell: bash
        run: |
          npm start > /tmp/docente-os-x5-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 "$E2E_BASE_URL/login" >/dev/null; then
              echo 'Local DOCENTE OS runtime is ready.'
              exit 0
            fi
            sleep 2
          done
          cat /tmp/docente-os-x5-server.log >&2 || true
          exit 1

      - name: Install Chromium
        working-directory: product
        run: npx playwright install --with-deps chromium

      - name: Run X5 UDA authoring acceptance gate
        working-directory: product
        run: npx playwright test --config=playwright.config.mjs e2e/x5-uda-authoring.spec.mjs

      - name: Publish X5 application evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x5-authoring-application-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            product/playwright-report/
            product/test-results/
            /tmp/docente-os-x5-server.log

      - name: Publish final X5 application status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const ok = process.env.JOB_STATUS === 'success'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'x5-authoring/application',
              description: ok ? 'X5 UDA authoring superato' : 'Gate X5 UDA authoring non superato',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })

  x5-render-acceptance:
    if: github.event_name != 'pull_request'
    name: x5-render-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_BASE_URL: https://docente-os-2026-27-beta.onrender.com

    steps:
      - name: Check E2E credential configuration
        shell: bash
        run: |
          if [ -z "${E2E_PASSWORD:-}" ]; then
            echo 'Repository secret DOCENTE_OS_E2E_PASSWORD is required.' >&2
            exit 1
          fi

      - name: Publish pending X5 Beta status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'x5-authoring/render-beta',
              description: 'Gate X5 authoring UDA sul Beta in esecuzione',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })

      - name: Checkout tested commit with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wait for Render to serve this product state
        shell: bash
        run: |
          expected="$GITHUB_SHA"
          for attempt in $(seq 1 120); do
            : > /tmp/build-info.json
            http_code="$(curl -sS --max-time 20 -o /tmp/build-info.json -w '%{http_code}' "$E2E_BASE_URL/api/build-info" 2>/dev/null || true)"
            payload="$(cat /tmp/build-info.json 2>/dev/null || true)"
            deployed="$(printf '%s' "$payload" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).commit||'')}catch{console.log('')}})")"
            echo "Attempt $attempt/120: http=${http_code:-000}, deployed=${deployed:-unavailable}, expected=$expected"
            if [ "$deployed" = "$expected" ]; then
              echo 'Render is serving the exact X5 commit.'
              exit 0
            fi
            if [ -n "$deployed" ] && git cat-file -e "$deployed^{commit}" 2>/dev/null && git diff --quiet "$deployed" "$expected" -- product; then
              echo 'Render product state is equivalent to the X5-tested state.'
              exit 0
            fi
            sleep 15
          done
          echo 'Render did not expose an equivalent X5 product state within 30 minutes.' >&2
          exit 1

      - name: Install product dependencies
        working-directory: product
        run: npm install --no-audit --no-fund

      - name: Install Playwright runner without changing the lockfile
        working-directory: product
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Chromium
        working-directory: product
        run: npx playwright install --with-deps chromium

      - name: Run X5 UDA authoring acceptance gate
        working-directory: product
        run: npx playwright test --config=playwright.config.mjs e2e/x5-uda-authoring.spec.mjs

      - name: Publish X5 Beta evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x5-authoring-beta-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            product/playwright-report/
            product/test-results/

      - name: Publish final X5 Beta status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const ok = process.env.JOB_STATUS === 'success'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'x5-authoring/render-beta',
              description: ok ? 'X5 UDA authoring superato sul Beta' : 'Gate X5 UDA authoring Beta non superato',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })